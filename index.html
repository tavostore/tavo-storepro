<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavo Store | Premium Cloud</title>
  <meta name="description" content="Tienda rápida con sección principal editable y catálogo por clic." />

  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root { --primary: #3b82f6; --bg: #020617; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: #f8fafc;
      margin: 0;
      overflow-x: hidden;
    }
    .premium-glass {
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
    }
    .smooth-card {
      transition: transform .25s ease, border-color .25s ease;
      content-visibility: auto;
      contain-intrinsic-size: 380px;
    }
    .smooth-card:hover { transform: translateY(-6px); border-color: rgba(59, 130, 246, .8); }
    .input-elegant {
      width: 100%; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 11px 13px; color: #f8fafc; font-size: 13px; outline: none;
    }
    .input-elegant:focus { border-color: var(--primary); }
    .cart-badge {
      position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff;
      border-radius: 999px; font-size: 10px; font-weight: 800; border: 2px solid var(--bg); padding: 1px 6px;
    }
    .active-tab { background: rgba(59, 130, 246, .25); border-color: rgba(59,130,246,.65); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { collection, deleteDoc, doc, getFirestore, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQwVbcCO2GHCHKL5EoEOG9Jo3ZAXGAy2o",
      authDomain: "tavostore-4dedf.firebaseapp.com",
      projectId: "tavostore-4dedf",
      storageBucket: "tavostore-4dedf.firebasestorage.app",
      messagingSenderId: "265905383641",
      appId: "1:265905383641:web:92499c7fe2620f988f36c8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "tavostore-main-app";

    window.fb = { auth, db, appId, collection, deleteDoc, doc, onAuthStateChanged, onSnapshot, setDoc, signInAnonymously, updateDoc };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const defaults = {
      rate: 62,
      settings: {
        logo: 'TAVO STORE',
        whatsapp: '584249649769',
        banner: '',
        background: '',
        headline: 'Bienvenido a nuestra tienda',
        storeInfo: 'Comparte aquí información de la tienda, horarios, promociones o novedades.',
        announTitle: 'ANUNCIO DESTACADO',
        announText: 'Publica aquí tu anuncio llamativo para captar clientes.',
      },
      products: []
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [data, setData] = useState(defaults);
      const [view, setView] = useState('store');
      const [storeSection, setStoreSection] = useState('inicio');
      const [loading, setLoading] = useState(true);
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      const [adminSettings, setAdminSettings] = useState(defaults.settings);

      useEffect(() => {
        if (!window.fb) return;
        window.fb.signInAnonymously(window.fb.auth).then(() => {
          window.fb.onAuthStateChanged(window.fb.auth, setUser);
        });
      }, []);

      useEffect(() => {
        if (!user || !window.fb) return;

        const configRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'configuracion', 'general');

        const unsubConfig = window.fb.onSnapshot(configRef, (snap) => {
          const remote = snap.exists() ? snap.data() : {};
          const merged = {
            ...defaults,
            ...remote,
            settings: { ...defaults.settings, ...(remote.settings || {}) }
          };
          setData((prev) => ({ ...prev, ...merged }));
          setAdminSettings((prev) => ({ ...prev, ...merged.settings }));

          if (merged.settings.background) {
            document.body.style.backgroundImage = `linear-gradient(rgba(2,6,23,.85), rgba(2,6,23,.92)), url('${merged.settings.background}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundAttachment = 'fixed';
          }
          setLoading(false);
        });

        const unsubProducts = window.fb.onSnapshot(
          window.fb.collection(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos'),
          (snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setData((prev) => ({ ...prev, products: list }));
          }
        );

        return () => { unsubConfig(); unsubProducts(); };
      }, [user]);

      const catalogProducts = useMemo(() => data.products.filter(Boolean), [data.products]);
      const cartTotal = cart.reduce((acc, item) => acc + (item.price || 0) * item.qty, 0);

      const uploadAsBase64 = (event, cb) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => cb(reader.result);
        reader.readAsDataURL(file);
      };

      const addToCart = (product) => {
        setCart((prev) => {
          const found = prev.find((item) => item.id === product.id);
          if (found) return prev.map((item) => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const checkout = () => {
        if (!cart.length) return;
        let msg = `🛒 *Pedido ${data.settings.logo}*\n\n`;
        cart.forEach((item) => { msg += `• ${item.name} x${item.qty} - $${(item.price * item.qty).toFixed(2)}\n`; });
        msg += `\n💵 Total: $${cartTotal.toFixed(2)}\n🇻🇪 Bs: ${(cartTotal * data.rate).toLocaleString('es-VE')}`;
        window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
      };

      const saveAdminSettings = async () => {
        const ref = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'configuracion', 'general');
        await window.fb.setDoc(ref, { ...data, settings: { ...data.settings, ...adminSettings } }, { merge: true });
      };

      const saveMediaSetting = (key, value) => {
        const ref = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'configuracion', 'general');
        window.fb.updateDoc(ref, { [`settings.${key}`]: value });
      };

      if (loading) return <div className="min-h-screen grid place-items-center text-xs uppercase tracking-[.35em] text-blue-400">Cargando tienda…</div>;

      return (
        <div className="min-h-screen pb-16">
          <nav className="sticky top-0 z-40 premium-glass px-4 md:px-8 py-4 flex items-center justify-between">
            <button className="flex items-center gap-3" onClick={() => { setView('store'); setStoreSection('inicio'); }}>
              <span className="w-9 h-9 rounded-xl bg-blue-600 grid place-items-center"><i className="fa-solid fa-bolt" /></span>
              <span className="font-black tracking-tight uppercase">{data.settings.logo}</span>
            </button>
            <div className="flex items-center gap-2">
              <button className="relative w-11 h-11 rounded-xl bg-white/5" onClick={() => setShowCart(true)}>
                <i className="fa-solid fa-bag-shopping" />
                {cart.length > 0 && <span className="cart-badge">{cart.length}</span>}
              </button>
              <button className="px-3 py-2 text-xs rounded-xl bg-white/5 border border-white/10" onClick={() => setView(view === 'admin' ? 'store' : 'admin')}>
                {view === 'admin' ? 'Tienda' : 'Admin'}
              </button>
            </div>
          </nav>

          {view === 'store' && (
            <>
              <section className="max-w-6xl mx-auto px-4 md:px-8 mt-6">
                <div className="flex gap-2">
                  <button className={`px-4 py-2 rounded-xl border text-xs uppercase font-black ${storeSection === 'inicio' ? 'active-tab' : 'bg-white/5 border-white/10'}`} onClick={() => setStoreSection('inicio')}>
                    Inicio
                  </button>
                  <button className={`px-4 py-2 rounded-xl border text-xs uppercase font-black ${storeSection === 'catalogo' ? 'active-tab' : 'bg-white/5 border-white/10'}`} onClick={() => setStoreSection('catalogo')}>
                    Catálogo
                  </button>
                </div>
              </section>

              {storeSection === 'inicio' && (
                <>
                  <header className="max-w-6xl mx-auto px-4 md:px-8 mt-5">
                    <div className="relative overflow-hidden rounded-3xl p-8 md:p-12 premium-glass">
                      {data.settings.banner && <img src={data.settings.banner} alt="Banner" loading="eager" decoding="async" className="absolute inset-0 w-full h-full object-cover opacity-30" />}
                      <div className="absolute inset-0 bg-gradient-to-r from-[#020617] via-[#020617]/70 to-transparent" />
                      <div className="relative z-10 max-w-3xl">
                        <p className="text-xs uppercase tracking-[.3em] text-blue-300 mb-2">Página principal</p>
                        <h1 className="text-3xl md:text-5xl font-black uppercase">{data.settings.headline}</h1>
                        <p className="mt-3 text-sm md:text-base text-slate-200">{data.settings.storeInfo}</p>
                        <div className="mt-5 inline-flex px-4 py-2 rounded-xl bg-blue-600/20 border border-blue-500/40 text-xs uppercase">Tasa BCV: Bs. {Number(data.rate).toFixed(2)}</div>
                      </div>
                    </div>
                  </header>

                  <section className="max-w-6xl mx-auto px-4 md:px-8 mt-6">
                    <div className="premium-glass rounded-2xl px-5 py-4 flex flex-wrap items-center justify-between gap-4 border border-blue-500/20">
                      <div>
                        <p className="text-[10px] uppercase tracking-[.3em] text-blue-300">Anuncio</p>
                        <h3 className="font-black text-lg uppercase">{data.settings.announTitle}</h3>
                        <p className="text-sm text-slate-300">{data.settings.announText}</p>
                      </div>
                      <button onClick={() => window.open(`https://wa.me/${data.settings.whatsapp}`)} className="px-4 py-2 rounded-xl bg-blue-600 text-xs font-black uppercase">Contactar ahora</button>
                    </div>
                  </section>
                </>
              )}

              {storeSection === 'catalogo' && (
                <section className="max-w-6xl mx-auto px-4 md:px-8 mt-6">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-2xl md:text-3xl font-black uppercase">Catálogo</h2>
                    <span className="text-xs uppercase tracking-[.3em] text-slate-400">{catalogProducts.length} productos</span>
                  </div>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                    {catalogProducts.map((p) => (
                      <article key={p.id} className="smooth-card premium-glass rounded-3xl overflow-hidden border border-white/10">
                        <div className="aspect-[4/3] bg-slate-900">
                          <img src={p.img || 'https://placehold.co/600x450/0f172a/ffffff?text=Producto'} alt={p.name} loading="lazy" decoding="async" className="w-full h-full object-cover" />
                        </div>
                        <div className="p-5">
                          <h3 className="font-black text-lg uppercase line-clamp-2">{p.name}</h3>
                          <p className="text-xs uppercase text-slate-300 mt-1">{p.status === 'order' ? 'Por encargo' : 'Disponible'}</p>
                          <div className="mt-4 flex items-center justify-between">
                            <div>
                              <p className="text-2xl font-black">${Number(p.price || 0).toFixed(2)}</p>
                              <p className="text-xs text-blue-300">Bs. {(Number(p.price || 0) * data.rate).toLocaleString('es-VE')}</p>
                            </div>
                            <button onClick={() => addToCart(p)} className="px-4 py-2 rounded-xl bg-blue-600 text-xs font-black uppercase">Agregar</button>
                          </div>
                        </div>
                      </article>
                    ))}
                  </div>
                </section>
              )}
            </>
          )}

          {view === 'admin' && (
            <section className="max-w-6xl mx-auto px-4 md:px-8 mt-8 space-y-6">
              <div className="premium-glass rounded-3xl p-6">
                <h2 className="text-2xl font-black uppercase mb-4">Editar página principal</h2>
                <div className="grid md:grid-cols-2 gap-3">
                  <input className="input-elegant" placeholder="Nombre de tienda" value={adminSettings.logo || ''} onChange={(e) => setAdminSettings({ ...adminSettings, logo: e.target.value })} />
                  <input className="input-elegant" placeholder="WhatsApp" value={adminSettings.whatsapp || ''} onChange={(e) => setAdminSettings({ ...adminSettings, whatsapp: e.target.value })} />
                  <input className="input-elegant md:col-span-2" placeholder="Título principal / headline" value={adminSettings.headline || ''} onChange={(e) => setAdminSettings({ ...adminSettings, headline: e.target.value })} />
                  <textarea className="input-elegant md:col-span-2 min-h-[90px]" placeholder="Información de la tienda o lo que quieras mostrar en la página principal" value={adminSettings.storeInfo || ''} onChange={(e) => setAdminSettings({ ...adminSettings, storeInfo: e.target.value })} />
                  <input className="input-elegant" placeholder="Título de anuncio" value={adminSettings.announTitle || ''} onChange={(e) => setAdminSettings({ ...adminSettings, announTitle: e.target.value })} />
                  <input className="input-elegant" placeholder="Texto de anuncio" value={adminSettings.announText || ''} onChange={(e) => setAdminSettings({ ...adminSettings, announText: e.target.value })} />
                </div>
                <div className="mt-4 flex flex-wrap gap-3">
                  <button className="px-5 py-3 rounded-xl bg-blue-600 text-xs font-black uppercase" onClick={saveAdminSettings}>Guardar cambios principal</button>
                  <label className="text-xs uppercase font-black bg-white/5 rounded-xl px-4 py-3 cursor-pointer">Banner <input type="file" className="hidden" onChange={(e) => uploadAsBase64(e, (v) => saveMediaSetting('banner', v))} /></label>
                  <label className="text-xs uppercase font-black bg-white/5 rounded-xl px-4 py-3 cursor-pointer">Fondo <input type="file" className="hidden" onChange={(e) => uploadAsBase64(e, (v) => saveMediaSetting('background', v))} /></label>
                </div>
              </div>

              <div className="premium-glass rounded-3xl p-6">
                <div className="flex flex-wrap justify-between items-center gap-4 mb-6">
                  <h2 className="text-2xl font-black uppercase">Gestión de catálogo</h2>
                  <button className="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs uppercase font-black" onClick={() => {
                    const id = `p_${Date.now()}`;
                    window.fb.setDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos', id), { name: 'Nuevo producto', price: 10, img: '', status: 'stock' });
                  }}>+ Agregar producto</button>
                </div>

                <div className="space-y-3">
                  {data.products.map((p) => (
                    <div key={p.id} className="bg-white/5 border border-white/10 rounded-2xl p-4 grid md:grid-cols-[1fr_130px_120px_120px] gap-3 items-center">
                      <input className="input-elegant" value={p.name || ''} onChange={(e) => window.fb.updateDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos', p.id), { name: e.target.value })} />
                      <input className="input-elegant" type="number" value={p.price || 0} onChange={(e) => window.fb.updateDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos', p.id), { price: Number(e.target.value) || 0 })} />
                      <select className="input-elegant" value={p.status || 'stock'} onChange={(e) => window.fb.updateDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos', p.id), { status: e.target.value })}>
                        <option value="stock">Stock</option>
                        <option value="order">Encargo</option>
                      </select>
                      <button className="h-[42px] rounded-xl bg-red-600/30 border border-red-400/40 text-xs uppercase font-black" onClick={() => window.fb.deleteDoc(window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'productos', p.id))}>Eliminar</button>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          )}

          {showCart && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm grid place-items-end md:place-items-center p-3" onClick={() => setShowCart(false)}>
              <div className="w-full md:max-w-lg premium-glass rounded-3xl p-6" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-black uppercase">Carrito</h3>
                  <button className="w-9 h-9 rounded-xl bg-white/10" onClick={() => setShowCart(false)}><i className="fa-solid fa-xmark" /></button>
                </div>
                <div className="max-h-[45vh] overflow-auto space-y-2">
                  {cart.length === 0 ? <p className="text-sm text-slate-400">Tu carrito está vacío.</p> : cart.map((item) => (
                    <div className="bg-white/5 border border-white/10 rounded-xl px-3 py-2 flex justify-between text-sm" key={item.id}>
                      <span>{item.name} x{item.qty}</span>
                      <span>${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-4 border-t border-white/10 pt-4">
                  <p className="text-xl font-black">Total: ${cartTotal.toFixed(2)}</p>
                  <button className="mt-3 w-full rounded-xl bg-blue-600 py-3 text-xs font-black uppercase disabled:opacity-50" disabled={!cart.length} onClick={checkout}>Enviar pedido por WhatsApp</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
