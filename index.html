<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavo Store | Premium Cloud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/MyKLSdJ3/1000975368.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --primary: #3b82f6;
            --bg: #020617;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        .premium-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
        }

        .input-elegant {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8rem;
            padding: 0.75rem 1rem;
            color: white;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-elegant:focus {
            border-color: var(--primary);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 99px;
            border: 2px solid var(--bg);
        }

        .ai-chat-window {
            height: 480px;
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        .badge-finance {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .file-upload-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body id="body-bg">
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>

    <script type="module">
        const { Client, Databases, Storage, ID, Query } = window.Appwrite;

        // Configuración de Appwrite
        const APPWRITE_ENDPOINT = "https://nyc.cloud.appwrite.io/v1";
        const APPWRITE_PROJECT_ID = "69af55b4001b39c183f6";
        const APPWRITE_DATABASE_ID = "69af55d00039b8e28285";
        const CONFIG_COLLECTION_ID = "configuracion";
        const PRODUCTS_COLLECTION_ID = "productos";
        const STORAGE_BUCKET_ID = "default"; // Reemplaza con tu ID de Bucket si usas Storage
        const CONFIG_DOC_ID = "tavo_store";

        const client = new Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const databases = new Databases(client);
        const storage = new Storage(client);

        // Helpers para manejo de datos
        const mergeDeep = (base, patch) => {
            const result = { ...base };
            Object.entries(patch).forEach(([key, value]) => {
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                    result[key] = mergeDeep(base?.[key] || {}, value);
                } else {
                    result[key] = value;
                }
            });
            return result;
        };

        const readConfig = async () => {
            try {
                return await databases.getDocument(APPWRITE_DATABASE_ID, CONFIG_COLLECTION_ID, CONFIG_DOC_ID);
            } catch (error) {
                if (error.code === 404) return null;
                throw error;
            }
        };

        window.storeApi = {
            async ensureConfig(defaultData) {
                const existing = await readConfig();
                if (existing) return existing;
                return databases.createDocument(APPWRITE_DATABASE_ID, CONFIG_COLLECTION_ID, CONFIG_DOC_ID, defaultData);
            },
            subscribeConfig(callback) {
                const load = async () => {
                    const config = await readConfig();
                    if (config) callback(config);
                };
                load();
                const intervalId = setInterval(load, 5000); // Intervalo más suave para no saturar
                return () => clearInterval(intervalId);
            },
            subscribeProducts(callback) {
                const load = async () => {
                    try {
                        const response = await databases.listDocuments(APPWRITE_DATABASE_ID, PRODUCTS_COLLECTION_ID, [Query.orderDesc('$createdAt')]);
                        callback(response.documents || []);
                    } catch (e) { console.error(e); }
                };
                load();
                const intervalId = setInterval(load, 5000);
                return () => clearInterval(intervalId);
            },
            async updateConfig(patch) {
                const existing = await readConfig();
                const payload = mergeDeep(existing || {}, patch);
                // Limpiar metadatos de Appwrite antes de actualizar
                ["$id", "$collectionId", "$databaseId", "$createdAt", "$updatedAt", "$permissions"].forEach(k => delete payload[k]);
                return databases.updateDocument(APPWRITE_DATABASE_ID, CONFIG_COLLECTION_ID, CONFIG_DOC_ID, payload);
            },
            async createProduct(data) {
                return databases.createDocument(APPWRITE_DATABASE_ID, PRODUCTS_COLLECTION_ID, ID.unique(), data);
            },
            async updateProduct(id, patch) {
                return databases.updateDocument(APPWRITE_DATABASE_ID, PRODUCTS_COLLECTION_ID, id, patch);
            },
            async deleteProduct(id) {
                return databases.deleteDocument(APPWRITE_DATABASE_ID, PRODUCTS_COLLECTION_ID, id);
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('store');
            const [isAdmin, setIsAdmin] = useState(false);
            const [loading, setLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [showAI, setShowAI] = useState(false);
            const [data, setData] = useState({
                rate: 62.00,
                settings: {
                    logo: "TAVO STORE",
                    whatsapp: "584249649769",
                    banner: "",
                    background: ""
                },
                products: []
            });

            useEffect(() => {
                if (!window.storeApi) return;

                window.storeApi.ensureConfig({
                    rate: data.rate,
                    settings: JSON.stringify(data.settings) // Guardar como string si hay errores de objeto
                }).catch(e => console.log("Config ya existe o error:", e));

                const unsubS = window.storeApi.subscribeConfig((cloudData) => {
                    let settings = cloudData.settings;
                    if (typeof settings === 'string') settings = JSON.parse(settings);
                    setData(prev => ({ ...prev, rate: cloudData.rate, settings: settings || prev.settings }));
                    if (settings?.background) {
                        document.body.style.backgroundImage = `url('${settings.background}')`;
                    }
                });

                const unsubP = window.storeApi.subscribeProducts((list) => {
                    setData(prev => ({ ...prev, products: list.map(d => ({ id: d.$id, ...d })) }));
                    setLoading(false);
                });

                return () => { unsubS(); unsubP(); };
            }, []);

            const handleFileUpload = (e, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => callback(reader.result);
                reader.readAsDataURL(file);
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const cartTotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const checkout = () => {
                let msg = `🛍️ *PEDIDO - ${data.settings.logo}*\n\n`;
                cart.forEach(item => { msg += `• ${item.name} (x${item.qty}) - $${item.price * item.qty}\n`; });
                msg += `\n💵 *TOTAL:* $${cartTotal.toFixed(2)}\n`;
                msg += `🇻🇪 *TOTAL BS:* Bs. ${(cartTotal * data.rate).toLocaleString('es-VE')}\n`;
                window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
            };

            const AIChat = () => {
                const [input, setInput] = useState("");
                const [chat, setChat] = useState([{ role: 'bot', text: `¡Hola! Soy el asistente de ${data.settings.logo}.` }]);
                const [isTyping, setIsTyping] = useState(false);

                const askAI = async () => {
                    if (!input.trim()) return;
                    const userText = input;
                    setInput("");
                    setChat(prev => [...prev, { role: 'user', text: userText }]);
                    setIsTyping(true);

                    try {
                        // RECUERDA COLOCAR TU API KEY AQUÍ
                        const apiKey = "TU_API_KEY_AQUI"; 
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Eres el asistente de ${data.settings.logo}. Tasa: ${data.rate}. Productos: ${data.products.map(p => p.name).join(", ")}. Cliente dice: ${userText}` }] }]
                            })
                        });
                        const result = await response.json();
                        setChat(prev => [...prev, { role: 'bot', text: result.candidates[0].content.parts[0].text }]);
                    } catch (e) {
                        setChat(prev => [...prev, { role: 'bot', text: "Lo siento, hubo un error de conexión." }]);
                    } finally { setIsTyping(false); }
                };

                return (
                    <div className="flex flex-col h-full bg-[#0f172a]">
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {chat.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-2xl text-[11px] ${msg.role === 'user' ? 'bg-blue-600' : 'bg-white/10'}`}>{msg.text}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-3 border-t border-white/5 flex gap-2">
                            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && askAI()} className="input-elegant text-[11px]" placeholder="Pregunta algo..." />
                            <button onClick={askAI} className="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shrink-0"><i className="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20 relative">
                    <nav className="fixed top-0 w-full z-50 premium-glass px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('store')}>
                            <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center"><i className="fas fa-bolt"></i></div>
                            <span className="text-lg font-black uppercase italic">{data.settings.logo}</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setShowCart(true)} className="relative w-11 h-11 bg-white/5 rounded-2xl flex items-center justify-center">
                                <i className="fas fa-shopping-bag"></i>
                                {cart.length > 0 && <span className="cart-badge">{cart.length}</span>}
                            </button>
                            <button onClick={() => setView(view === 'admin' ? 'store' : 'admin')} className="bg-white/5 px-4 py-2.5 rounded-2xl text-[10px] font-black">
                                {view === 'admin' ? 'TIENDA' : 'ADMIN'}
                            </button>
                        </div>
                    </nav>

                    {view === 'store' ? (
                        <div className="fade-in pt-16">
                            <header className="relative h-[40vh] flex items-center justify-center overflow-hidden">
                                {data.settings.banner && <img src={data.settings.banner} className="absolute inset-0 w-full h-full object-cover opacity-40" />}
                                <div className="relative text-center">
                                    <h1 className="text-6xl md:text-8xl font-black italic uppercase mb-4">{data.settings.logo}</h1>
                                    <p className="bg-blue-600/20 border border-blue-500/30 px-6 py-2 rounded-2xl inline-block text-[10px] font-black">TASA BCV: Bs. {data.rate.toFixed(2)}</p>
                                </div>
                            </header>

                            <div id="productos" className="max-w-7xl mx-auto px-4 grid grid-cols-2 lg:grid-cols-4 gap-6 py-20">
                                {data.products.map(p => (
                                    <div key={p.id} className="product-card premium-glass rounded-[2rem] overflow-hidden flex flex-col group">
                                        <div className="aspect-square bg-slate-900">
                                            {p.img && <img src={p.img} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />}
                                        </div>
                                        <div className="p-5 flex-1 flex flex-col">
                                            <h3 className="text-xs font-bold uppercase mb-4 h-8 line-clamp-2">{p.name}</h3>
                                            <div className="mt-auto">
                                                <p className="text-2xl font-black italic">${p.price}</p>
                                                <p className="text-[9px] text-slate-400 mb-4">Bs. {(p.price * data.rate).toLocaleString('es-VE')}</p>
                                                <div className="flex gap-2">
                                                    <button onClick={() => addToCart(p)} className="flex-1 bg-white/5 border border-white/10 h-10 rounded-xl"><i className="fas fa-cart-plus"></i></button>
                                                    <button onClick={() => window.open(`https://wa.me/${data.settings.whatsapp}?text=Me interesa: ${p.name}`)} className="flex-1 bg-blue-600 h-10 rounded-xl text-[10px] font-black uppercase">Pedir</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-5xl mx-auto px-6 py-32 fade-in">
                            {!isAdmin ? (
                                <div className="flex flex-col items-center justify-center h-[50vh]">
                                    <input type="password" placeholder="Clave de Admin" className="input-elegant max-w-xs text-center mb-4" onKeyDown={e => e.key === 'Enter' && e.target.value === 'tavo2026' && setIsAdmin(true)} />
                                    <p className="text-[10px] opacity-30">Pista: tavo2026</p>
                                </div>
                            ) : (
                                <div className="space-y-10">
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div className="premium-glass p-8 rounded-[2rem] space-y-4">
                                            <h3 className="font-black italic uppercase text-blue-500">Global</h3>
                                            <label className="text-[9px] uppercase font-bold block">Tasa Dólar</label>
                                            <input type="number" step="0.01" className="input-elegant" value={data.rate} onChange={e => window.storeApi.updateConfig({ rate: parseFloat(e.target.value) })} />
                                            <label className="text-[9px] uppercase font-bold block">WhatsApp</label>
                                            <input className="input-elegant" value={data.settings.whatsapp} onChange={e => window.storeApi.updateConfig({ settings: JSON.stringify({ ...data.settings, whatsapp: e.target.value }) })} />
                                        </div>
                                        <div className="premium-glass p-8 rounded-[2rem] space-y-4">
                                            <h3 className="font-black italic uppercase text-blue-500">Multimedia</h3>
                                            <button onClick={() => document.getElementById('bgIn').click()} className="file-upload-btn w-full">Fondo Tienda</button>
                                            <input id="bgIn" type="file" className="hidden" onChange={e => handleFileUpload(e, (b64) => window.storeApi.updateConfig({ settings: JSON.stringify({ ...data.settings, background: b64 }) }))} />
                                            <button onClick={() => document.getElementById('bnIn').click()} className="file-upload-btn w-full">Banner Header</button>
                                            <input id="bnIn" type="file" className="hidden" onChange={e => handleFileUpload(e, (b64) => window.storeApi.updateConfig({ settings: JSON.stringify({ ...data.settings, banner: b64 }) }))} />
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center">
                                            <h3 className="text-xl font-black italic uppercase">Inventario</h3>
                                            <button onClick={() => window.storeApi.createProduct({ name: "Nuevo Producto", price: 0, status: "stock", img: "" })} className="bg-blue-600 px-6 py-2 rounded-xl text-[10px] font-black">+ NUEVO</button>
                                        </div>
                                        <div className="grid gap-4">
                                            {data.products.map(p => (
                                                <div key={p.id} className="premium-glass p-4 rounded-2xl flex items-center gap-4">
                                                    <img src={p.img || 'https://placehold.co/80'} className="w-16 h-16 rounded-xl object-cover" onClick={() => document.getElementById(`f_${p.id}`).click()} />
                                                    <input id={`f_${p.id}`} type="file" className="hidden" onChange={e => handleFileUpload(e, (b64) => window.storeApi.updateProduct(p.id, { img: b64 }))} />
                                                    <div className="flex-1 grid grid-cols-2 gap-2">
                                                        <input className="input-elegant text-[10px]" value={p.name} onChange={e => window.storeApi.updateProduct(p.id, { name: e.target.value })} />
                                                        <input className="input-elegant text-[10px]" type="number" value={p.price} onChange={e => window.storeApi.updateProduct(p.id, { price: parseFloat(e.target.value) })} />
                                                    </div>
                                                    <button onClick={() => window.storeApi.deleteProduct(p.id)} className="text-red-500 px-4"><i className="fas fa-trash"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {showCart && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex justify-end">
                            <div className="w-full max-w-sm h-full bg-[#020617] p-8 flex flex-col border-l border-white/5">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-xl font-black italic uppercase">Carrito</h2>
                                    <button onClick={() => setShowCart(false)} className="w-10 h-10 bg-white/5 rounded-xl"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-4">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-white/5 p-3 rounded-2xl">
                                            <div className="flex-1 text-[10px] font-bold uppercase">{item.name}</div>
                                            <div className="text-blue-500 font-black">${item.price}</div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-red-500"><i className="fas fa-trash"></i></button>
                                        </div>
                                    ))}
                                </div>
                                {cart.length > 0 && (
                                    <div className="pt-6 border-t border-white/10 space-y-4">
                                        <div className="flex justify-between">
                                            <span className="text-[10px] font-black opacity-50">TOTAL USD</span>
                                            <span className="font-black italic">${cartTotal.toFixed(2)}</span>
                                        </div>
                                        <button onClick={checkout} className="w-full bg-blue-600 py-4 rounded-2xl font-black text-[10px] uppercase">Finalizar por WhatsApp</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-4">
                        {showAI && (
                            <div className="premium-glass rounded-[2rem] overflow-hidden ai-chat-window fade-in border border-blue-500/30">
                                <div className="bg-blue-600 p-4 flex justify-between items-center">
                                    <span className="text-[10px] font-black uppercase tracking-widest">IA Assistant</span>
                                    <button onClick={() => setShowAI(false)}><i className="fas fa-times"></i></button>
                                </div>
                                <AIChat />
                            </div>
                        )}
                        <button onClick={() => setShowAI(!showAI)} className="w-14 h-14 bg-blue-600 rounded-2xl shadow-2xl flex items-center justify-center text-white">
                            <i className={`fas ${showAI ? 'fa-times' : 'fa-robot'}`}></i>
                        </button>
                    </div>

                    <footer className="text-center py-10 opacity-20 text-[9px] font-black uppercase tracking-[0.5em]">
                        © 2026 {data.settings.logo} | VENEZUELA
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
