<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .print-hidden { display: none !important; }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURACIÓN DE SUPABASE ---
    const supabaseUrl = 'TU_URL_DE_SUPABASE'; // REEMPLAZA CON TU URL
    const supabaseKey = 'TU_KEY_DE_SUPABASE'; // REEMPLAZA CON TU KEY
    
    // Solo creamos el cliente si las credenciales están presentes
    let supabase = null;
    if (supabaseUrl !== 'TU_URL_DE_SUPABASE' && supabaseKey !== 'TU_KEY_DE_SUPABASE') {
      supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    }

    // --- ICONOS LUCIDE ---
    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} width={size} height={size} className={className}></i>;
    };

    // --- COMPONENTES UI BASE ---
    
    // Tarjeta para el Dashboard
    const StatCard = ({ title, value, icon, trend, trendUp }) => (
      <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
        <div>
          <p className="text-sm font-medium text-gray-500 mb-1">{title}</p>
          <h3 className="text-2xl font-bold text-gray-800">{value}</h3>
          {trend && (
            <p className={`text-sm mt-2 flex items-center gap-1 ${trendUp ? 'text-emerald-600' : 'text-rose-600'}`}>
              <Icon name={trendUp ? 'trending-up' : 'trending-down'} size={14} />
              {trend} vs mes anterior
            </p>
          )}
        </div>
        <div className={`p-3 rounded-lg ${trendUp !== false ? 'bg-primary-50 text-primary-600' : 'bg-gray-50 text-gray-600'}`}>
          <Icon name={icon} size={24} />
        </div>
      </div>
    );

    // --- COMPONENTES DE VISTAS (PLACEHOLDERS ACTUALIZADOS) ---
    
    const DashboardOverview = () => (
      <div className="space-y-6">
        <h2 className="text-2xl font-bold text-gray-800">Resumen General</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <StatCard title="Ingresos Totales" value="$24,500" icon="dollar-sign" trend="+12.5%" trendUp={true} />
          <StatCard title="Clientes Activos" value="142" icon="users" trend="+5.2%" trendUp={true} />
          <StatCard title="Facturas Pendientes" value="8" icon="file-text" trend="-2" trendUp={false} />
          <StatCard title="Tasa de Cobro" value="94%" icon="activity" trend="+1.1%" trendUp={true} />
        </div>
        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm mt-6">
          <h3 className="text-lg font-bold text-gray-800 mb-4">Actividad Reciente</h3>
          <p className="text-gray-500 text-sm">Próximamente: Gráficos de ingresos y flujo de caja.</p>
        </div>
      </div>
    );

    const ClientesView = () => (
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div className="flex justify-between items-center mb-6">
          <h2 className="text-xl font-bold text-gray-800">Directorio de Clientes</h2>
          <button className="bg-primary-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-primary-700 flex items-center gap-2">
            <Icon name="plus" size={16} /> Nuevo Cliente
          </button>
        </div>
        <p className="text-gray-500 text-sm mb-4">Módulo en construcción. Aquí se listarán los clientes desde la tabla `clients` de Supabase.</p>
        
        {/* Tabla Placeholder */}
        <div className="overflow-x-auto">
          <table className="w-full text-left border-collapse">
            <thead>
              <tr className="border-b text-gray-500 text-sm">
                <th className="py-3 px-4 font-medium">Nombre</th>
                <th className="py-3 px-4 font-medium">Email</th>
                <th className="py-3 px-4 font-medium">Teléfono</th>
                <th className="py-3 px-4 font-medium text-right">Acciones</th>
              </tr>
            </thead>
            <tbody className="text-sm">
              <tr className="border-b border-gray-50 hover:bg-gray-50">
                <td className="py-3 px-4 font-medium text-gray-800">Juan Pérez</td>
                <td className="py-3 px-4 text-gray-600">juan@ejemplo.com</td>
                <td className="py-3 px-4 text-gray-600">+1 234 567 890</td>
                <td className="py-3 px-4 text-right text-gray-400">
                  <button className="hover:text-primary-600 mr-2"><Icon name="edit" size={16} /></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    );

    const InventarioView = () => (
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div className="flex justify-between items-center mb-6">
          <h2 className="text-xl font-bold text-gray-800">Gestión de Inventario (Productos)</h2>
          <button className="bg-primary-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-primary-700 flex items-center gap-2">
            <Icon name="plus" size={16} /> Nuevo Producto
          </button>
        </div>
        <p className="text-gray-500 text-sm mb-4">Aquí se gestionarán los productos de la tabla `products` de Supabase. El Punto de Venta leerá de aquí.</p>
      </div>
    );

    const CobranzaView = () => (
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
         <div className="flex justify-between items-center mb-6">
          <h2 className="text-xl font-bold text-gray-800">Cuentas por Cobrar (Deudas)</h2>
        </div>
        <p className="text-gray-500 text-sm">Aquí se listarán las deudas generadas automáticamente desde el Punto de Venta (tabla `debts`).</p>
      </div>
    );

    const ReportesView = () => (
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h2 className="text-xl font-bold text-gray-800 mb-6">Reportes y Análisis</h2>
        <p className="text-gray-500 text-sm">Próximamente.</p>
      </div>
    );

    // --- NUEVO COMPONENTE: PUNTO DE VENTA (POS) E INTEGRACIÓN ---
    
    const PuntoDeVentaView = ({ supabase }) => {
        // Si no hay conexión a Supabase, mostramos advertencia
        if (!supabase) {
          return (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-center">
              <Icon name="alert-triangle" size={48} className="mx-auto mb-4 text-amber-500" />
              <h3 className="text-lg font-bold mb-2">Conexión a Base de Datos Requerida</h3>
              <p>Para usar el Punto de Venta, necesitas configurar tus credenciales de Supabase en el código (URL y KEY).</p>
            </div>
          );
        }

        const [productos, setProductos] = useState([]);
        const [clientes, setClientes] = useState([]);
        const [carrito, setCarrito] = useState([]);
        const [busqueda, setBusqueda] = useState('');
        const [cargando, setCargando] = useState(true);
        
        // Estados para el Checkout
        const [mostrarModalPago, setMostrarModalPago] = useState(false);
        const [clienteSeleccionado, setClienteSeleccionado] = useState('');
        const [montoPagado, setMontoPagado] = useState('');
        const [facturaGenerada, setFacturaGenerada] = useState(null);
        const [procesandoVenta, setProcesandoVenta] = useState(false);

        // Cargar datos al iniciar
        useEffect(() => {
            cargarDatos();
        }, []);

        const cargarDatos = async () => {
            setCargando(true);
            try {
              // Cargar Productos
              const { data: prods, error: errProds } = await supabase.from('products').select('*').order('name');
              if (errProds) console.error("Error cargando productos:", errProds);
              else setProductos(prods || []);

              // Cargar Clientes
              const { data: clis, error: errClis } = await supabase.from('clients').select('*').order('name');
              if (errClis) console.error("Error cargando clientes:", errClis);
              else setClientes(clis || []);
            } catch (error) {
              console.error("Error general cargando datos:", error);
            } finally {
              setCargando(false);
            }
        };

        const productosFiltrados = productos.filter(p => p.name && p.name.toLowerCase().includes(busqueda.toLowerCase()));
        const totalCarrito = carrito.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        const agregarAlCarrito = (producto) => {
            if (producto.stock <= 0) return alert('Este producto no tiene stock disponible.');
            
            const itemExistente = carrito.find(item => item.id === producto.id);
            if (itemExistente) {
                if (itemExistente.quantity >= producto.stock) return alert(`Solo hay ${producto.stock} unidades en stock.`);
                setCarrito(carrito.map(item => item.id === producto.id ? { ...item, quantity: item.quantity + 1 } : item));
            } else {
                setCarrito([...carrito, { ...producto, quantity: 1 }]);
            }
        };

        const removerDelCarrito = (id) => {
            setCarrito(carrito.filter(item => item.id !== id));
        };

        const procesarVenta = async () => {
            if (!clienteSeleccionado) return alert('Por favor, seleccione un cliente de la lista.');
            if (carrito.length === 0) return alert('El carrito está vacío.');
            
            setProcesandoVenta(true);
            const pago = parseFloat(montoPagado) || 0;
            const deuda = totalCarrito - pago;
            const clienteObj = clientes.find(c => c.id.toString() === clienteSeleccionado);

            try {
                // 1. Registrar la Venta en Supabase
                const nuevaVenta = {
                    client_id: clienteSeleccionado,
                    client_name: clienteObj.name,
                    total: totalCarrito,
                    amount_paid: pago,
                    items: carrito 
                };
                
                const { data: ventaGuardada, error: errorVenta } = await supabase
                  .from('sales')
                  .insert([nuevaVenta])
                  .select()
                  .single();
                  
                if (errorVenta) throw errorVenta;

                // 2. Registrar Deuda Automáticamente (si el pago es menor al total)
                if (deuda > 0) {
                    const nuevaDeuda = {
                        client_id: clienteSeleccionado,
                        client_name: clienteObj.name,
                        sale_id: ventaGuardada.id,
                        total_amount: totalCarrito,
                        paid_amount: pago,
                        balance: deuda,
                        status: 'pending'
                    };
                    const { error: errorDeuda } = await supabase.from('debts').insert([nuevaDeuda]);
                    if (errorDeuda) console.error("Error al registrar deuda:", errorDeuda);
                }

                // 3. Actualizar Stock de Inventario en Supabase
                for (let item of carrito) {
                    const nuevoStock = item.stock - item.quantity;
                    const { error: errorStock } = await supabase
                      .from('products')
                      .update({ stock: nuevoStock })
                      .eq('id', item.id);
                      
                    if (errorStock) console.error(`Error actualizando stock de ${item.name}:`, errorStock);
                }

                // 4. Mostrar Factura y Limpiar Estado
                setFacturaGenerada({ ...ventaGuardada, cliente: clienteObj, items: carrito });
                setCarrito([]);
                setMostrarModalPago(false);
                setMontoPagado('');
                setClienteSeleccionado('');
                
                // Recargar datos para tener el stock actualizado
                cargarDatos(); 

            } catch (error) {
                console.error("Error al procesar venta:", error);
                alert("Hubo un error al guardar la venta en la base de datos.");
            } finally {
                setProcesandoVenta(false);
            }
        };

        // --- SUBVISTA: FACTURA GENERADA ---
        if (facturaGenerada) {
            return (
                <div className="bg-white p-8 rounded-xl shadow-sm max-w-2xl mx-auto mt-6 print-area">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-gray-800">FACTURA</h2>
                        <p className="text-gray-500">#{facturaGenerada.id ? facturaGenerada.id.slice(0,8).toUpperCase() : '0001'}</p>
                        <p className="text-sm text-gray-500">
                          {facturaGenerada.created_at ? new Date(facturaGenerada.created_at).toLocaleString() : new Date().toLocaleString()}
                        </p>
                    </div>
                    
                    <div className="flex justify-between mb-8 pb-6 border-b border-gray-100">
                      <div>
                        <h3 className="font-bold text-gray-700 mb-1">Facturar a:</h3>
                        <p className="font-medium text-gray-800">{facturaGenerada.cliente.name}</p>
                        {facturaGenerada.cliente.email && <p className="text-sm text-gray-500">{facturaGenerada.cliente.email}</p>}
                        {facturaGenerada.cliente.phone && <p className="text-sm text-gray-500">{facturaGenerada.cliente.phone}</p>}
                      </div>
                      <div className="text-right">
                        <h3 className="font-bold text-gray-700 mb-1">Emitido por:</h3>
                        <p className="font-medium text-gray-800">Sistema de Gestión Pro</p>
                        <p className="text-sm text-gray-500">Tu Empresa S.A.</p>
                      </div>
                    </div>

                    <table className="w-full mb-8">
                        <thead>
                            <tr className="border-b-2 border-gray-200 text-left text-gray-600 text-sm uppercase tracking-wider">
                                <th className="py-3 px-2">Producto/Servicio</th>
                                <th className="py-3 px-2 text-center">Cant</th>
                                <th className="py-3 px-2 text-right">Precio Unit.</th>
                                <th className="py-3 px-2 text-right">Importe</th>
                            </tr>
                        </thead>
                        <tbody>
                            {facturaGenerada.items.map((item, idx) => (
                                <tr key={idx} className="border-b border-gray-100 text-gray-800">
                                    <td className="py-4 px-2">{item.name}</td>
                                    <td className="py-4 px-2 text-center">{item.quantity}</td>
                                    <td className="py-4 px-2 text-right">${item.price.toFixed(2)}</td>
                                    <td className="py-4 px-2 text-right font-medium">${(item.price * item.quantity).toFixed(2)}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    <div className="flex justify-end mb-8">
                        <div className="w-72 space-y-3 bg-gray-50 p-6 rounded-xl">
                            <div className="flex justify-between text-gray-600">
                              <span>Subtotal:</span>
                              <span>${facturaGenerada.total.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between font-bold text-xl text-gray-800 pt-2 border-t border-gray-200">
                              <span>Total:</span>
                              <span>${facturaGenerada.total.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between text-emerald-600 pt-2">
                              <span>Monto Pagado:</span>
                              <span>${facturaGenerada.amount_paid.toFixed(2)}</span>
                            </div>
                            
                            {(facturaGenerada.total - facturaGenerada.amount_paid) > 0 && (
                              <div className="flex justify-between text-rose-600 font-bold pt-2 border-t border-rose-100">
                                <span>Saldo Pendiente (Deuda):</span>
                                <span>${(facturaGenerada.total - facturaGenerada.amount_paid).toFixed(2)}</span>
                              </div>
                            )}
                        </div>
                    </div>

                    <div className="flex gap-4 justify-center print-hidden">
                        <button onClick={() => window.print()} className="bg-primary-600 text-white px-6 py-3 rounded-xl font-medium hover:bg-primary-700 flex items-center gap-2 transition-colors shadow-sm">
                          <Icon name="printer" size={20}/> Imprimir Factura
                        </button>
                        <button onClick={() => setFacturaGenerada(null)} className="bg-white border border-gray-200 text-gray-700 px-6 py-3 rounded-xl font-medium hover:bg-gray-50 transition-colors">
                          Nueva Venta
                        </button>
                    </div>
                </div>
            );
        }

        // --- VISTA PRINCIPAL DEL POS ---
        return (
            <div className="flex flex-col lg:flex-row gap-6 h-[calc(100vh-120px)]">
                
                {/* Panel Izquierdo: Buscador y Catálogo de Productos */}
                <div className="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="p-5 border-b border-gray-100 bg-gray-50/50">
                        <div className="relative">
                            <Icon name="search" className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
                            <input 
                              type="text" 
                              placeholder="Buscar en el inventario por nombre..." 
                              value={busqueda} 
                              onChange={e => setBusqueda(e.target.value)} 
                              className="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all shadow-sm" 
                            />
                        </div>
                    </div>
                    
                    <div className="p-5 flex-1 overflow-auto bg-gray-50/30">
                        {cargando ? (
                          <div className="flex justify-center items-center h-full text-gray-400">
                            <Icon name="loader" size={32} className="animate-spin" />
                          </div>
                        ) : productosFiltrados.length === 0 ? (
                          <div className="text-center text-gray-500 mt-10">
                            <Icon name="package-x" size={48} className="mx-auto mb-4 text-gray-300" />
                            <p>No se encontraron productos.</p>
                            <p className="text-sm mt-1">Asegúrate de tener productos registrados en tu base de datos.</p>
                          </div>
                        ) : (
                          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 auto-rows-max">
                              {productosFiltrados.map(prod => (
                                  <div 
                                    key={prod.id} 
                                    onClick={() => agregarAlCarrito(prod)} 
                                    className={`p-4 border rounded-xl cursor-pointer transition-all ${
                                      prod.stock > 0 
                                      ? 'bg-white hover:border-primary-400 hover:shadow-md' 
                                      : 'bg-gray-100 border-gray-200 opacity-60 cursor-not-allowed'
                                    }`}
                                  >
                                      <div className="h-10 w-10 bg-primary-50 text-primary-600 rounded-lg flex items-center justify-center mb-3">
                                        <Icon name="package" size={20} />
                                      </div>
                                      <h3 className="font-bold text-gray-800 mb-1 line-clamp-2 leading-tight">{prod.name}</h3>
                                      <p className="text-primary-600 font-black text-lg">${prod.price.toFixed(2)}</p>
                                      <p className="text-xs text-gray-500 mt-2 flex items-center gap-1 font-medium">
                                        <Icon name="layers" size={12} /> Stock: {prod.stock}
                                      </p>
                                  </div>
                              ))}
                          </div>
                        )}
                    </div>
                </div>

                {/* Panel Derecho: Carrito y Checkout */}
                <div className="w-full lg:w-96 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
                    <div className="p-5 border-b border-gray-100 flex items-center justify-between">
                        <h2 className="font-bold text-lg text-gray-800 flex items-center gap-2">
                          <Icon name="shopping-cart" size={20} className="text-primary-600" /> Venta Actual
                        </h2>
                        <span className="bg-primary-50 text-primary-700 text-xs font-bold px-3 py-1 rounded-full border border-primary-100">
                          {carrito.reduce((sum, item) => sum + item.quantity, 0)} items
                        </span>
                    </div>
                    
                    <div className="flex-1 overflow-auto p-5 space-y-3 bg-gray-50/50">
                        {carrito.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-full text-gray-400">
                              <Icon name="shopping-bag" size={48} className="mb-4 text-gray-300" />
                              <p>El carrito está vacío</p>
                            </div>
                        ) : (
                            carrito.map(item => (
                                <div key={item.id} className="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                                    <div className="flex-1 pr-2">
                                        <h4 className="font-bold text-gray-800 text-sm leading-tight mb-1">{item.name}</h4>
                                        <p className="text-xs text-gray-500 font-medium">{item.quantity} x ${item.price.toFixed(2)}</p>
                                    </div>
                                    <div className="flex items-center gap-3 pl-2 border-l border-gray-50">
                                        <span className="font-black text-gray-800">${(item.price * item.quantity).toFixed(2)}</span>
                                        <button onClick={() => removerDelCarrito(item.id)} className="text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition-colors">
                                          <Icon name="trash-2" size={16}/>
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                    
                    <div className="p-5 border-t border-gray-100 bg-white">
                        <div className="flex justify-between items-end mb-5">
                            <span className="text-gray-500 font-medium">Total a Pagar</span>
                            <span className="text-3xl font-black text-gray-800">${totalCarrito.toFixed(2)}</span>
                        </div>
                        <button 
                          onClick={() => setMostrarModalPago(true)} 
                          disabled={carrito.length === 0} 
                          className="w-full bg-primary-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-primary-700 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed transition-all shadow-sm flex justify-center items-center gap-2"
                        >
                            <Icon name="credit-card" size={20} />
                            Procesar Pago
                        </button>
                    </div>
                </div>

                {/* Modal Flotante de Checkout */}
                {mostrarModalPago && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                        <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
                            <div className="p-6 border-b border-gray-100 bg-gray-50/50">
                              <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <Icon name="check-circle" size={24} className="text-primary-600" />
                                Confirmar Venta
                              </h3>
                            </div>
                            
                            <div className="p-6 space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Seleccionar Cliente</label>
                                    <select 
                                      value={clienteSeleccionado} 
                                      onChange={(e) => setClienteSeleccionado(e.target.value)} 
                                      className="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none bg-white text-gray-700 shadow-sm"
                                    >
                                        <option value="">-- Elige un cliente registrado --</option>
                                        {clientes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <p className="text-xs text-gray-500 mt-2">Los clientes se cargan desde tu base de datos Supabase.</p>
                                </div>
                                
                                <div className="bg-primary-50 p-5 rounded-xl border border-primary-100 flex justify-between items-center">
                                    <span className="font-bold text-primary-800">Total Factura:</span>
                                    <span className="text-2xl font-black text-primary-700">${totalCarrito.toFixed(2)}</span>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Monto Pagado Hoy</label>
                                    <div className="relative">
                                      <span className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 font-bold">$</span>
                                      <input 
                                        type="number" 
                                        value={montoPagado} 
                                        onChange={(e) => setMontoPagado(e.target.value)} 
                                        placeholder={`Ej. ${totalCarrito}`} 
                                        className="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-lg font-medium shadow-sm" 
                                      />
                                    </div>
                                    
                                    {/* Alerta de Deuda Automática */}
                                    {montoPagado && parseFloat(montoPagado) < totalCarrito && (
                                        <div className="mt-3 bg-rose-50 text-rose-700 p-3 rounded-lg text-sm font-medium border border-rose-100 flex items-start gap-2">
                                          <Icon name="alert-circle" size={18} className="mt-0.5 shrink-0" />
                                          <p>El cliente no está pagando el total. Se registrará automáticamente una deuda en su cuenta por <strong>${(totalCarrito - parseFloat(montoPagado)).toFixed(2)}</strong>.</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="p-6 border-t border-gray-100 bg-gray-50/50 flex gap-3">
                                <button 
                                  onClick={() => setMostrarModalPago(false)} 
                                  className="flex-1 py-3 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-100 font-bold transition-colors bg-white shadow-sm"
                                  disabled={procesandoVenta}
                                >
                                  Cancelar
                                </button>
                                <button 
                                  onClick={procesarVenta} 
                                  className="flex-1 py-3 bg-primary-600 text-white rounded-xl hover:bg-primary-700 font-bold transition-colors shadow-sm flex justify-center items-center gap-2 disabled:opacity-70"
                                  disabled={procesandoVenta}
                                >
                                  {procesandoVenta ? <Icon name="loader" size={20} className="animate-spin" /> : <Icon name="check" size={20} />}
                                  {procesandoVenta ? 'Procesando...' : 'Finalizar Venta'}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // --- APLICACIÓN PRINCIPAL ---
    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('inicio');

      // Modificamos el menú para integrar las nuevas secciones
      const menuItems = [
        { id: 'inicio', label: 'Dashboard', icon: 'home' },
        { id: 'pos', label: 'Punto de Venta', icon: 'shopping-cart' },
        { id: 'clientes', label: 'Clientes', icon: 'users' },
        { id: 'inventario', label: 'Inventario', icon: 'package' },
        { id: 'cobranza', label: 'Cobranza y Deudas', icon: 'credit-card' },
        { id: 'reportes', label: 'Reportes', icon: 'bar-chart-2' }
      ];

      useEffect(() => {
        // Ignoramos la autenticación real si no hay credenciales configuradas
        if (!supabase) {
          console.warn("Supabase no configurado. Simulando login para pruebas.");
          setUser({ email: 'admin@demo.com' });
          setLoading(false);
          return;
        }

        const checkSession = async () => {
          const { data: { session } } = await supabase.auth.getSession();
          setUser(session?.user || null);
          setLoading(false);
        };
        
        checkSession();

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleLogout = async () => {
        if (supabase) await supabase.auth.signOut();
        else setUser(null); // Logout simulado
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-50">
            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
          </div>
        );
      }

      // VISTA DE LOGIN
      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
            <div className="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
              <div className="text-center">
                <div className="mx-auto h-16 w-16 bg-primary-100 rounded-full flex items-center justify-center mb-4">
                  <Icon name="briefcase" size={32} className="text-primary-600" />
                </div>
                <h2 className="text-3xl font-extrabold text-gray-900">Bienvenido de nuevo</h2>
                <p className="mt-2 text-sm text-gray-600">Inicia sesión en tu cuenta para continuar</p>
              </div>
              <form className="mt-8 space-y-6" onSubmit={(e) => { e.preventDefault(); /* Lógica de login original */ }}>
                <div className="rounded-md shadow-sm space-y-4">
                  <div>
                    <label htmlFor="email-address" className="sr-only">Email address</label>
                    <input id="email-address" name="email" type="email" required className="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-xl focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm" placeholder="Correo electrónico" />
                  </div>
                  <div>
                    <label htmlFor="password" className="sr-only">Password</label>
                    <input id="password" name="password" type="password" required className="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-xl focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm" placeholder="Contraseña" />
                  </div>
                </div>
                <div>
                  <button type="submit" className="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">
                    Iniciar Sesión
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // Enrutador interno
      const renderContent = () => {
        switch (activeTab) {
          case 'inicio': return <DashboardOverview />;
          case 'pos': return <PuntoDeVentaView supabase={supabase} />;
          case 'clientes': return <ClientesView />;
          case 'inventario': return <InventarioView />;
          case 'cobranza': return <CobranzaView />;
          case 'reportes': return <ReportesView />;
          default: return <DashboardOverview />;
        }
      };

      // VISTA DEL DASHBOARD COMPLETO
      return (
        <div className="flex h-screen bg-gray-50 font-sans print-area">
          {/* Sidebar */}
          <aside className="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex print-hidden">
            <div className="h-16 flex items-center px-6 border-b border-gray-100">
              <Icon name="briefcase" className="text-primary-600 mr-2" />
              <span className="text-xl font-black text-gray-800 tracking-tight">Gestión<span className="text-primary-600">Pro</span></span>
            </div>
            
            <nav className="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
              <p className="px-3 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Menú Principal</p>
              {menuItems.map((item) => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all duration-200 ${
                    activeTab === item.id
                      ? 'bg-primary-50 text-primary-700 shadow-sm'
                      : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                  }`}
                >
                  <Icon name={item.icon} size={18} className={`mr-3 ${activeTab === item.id ? 'text-primary-600' : 'text-gray-400'}`} />
                  {item.label}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-gray-100">
              <div className="flex items-center gap-3 px-3 py-2 mb-2 bg-gray-50 rounded-lg border border-gray-100">
                <div className="h-8 w-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-bold text-sm">
                  {user.email ? user.email.charAt(0).toUpperCase() : 'A'}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-medium text-gray-700 truncate">{user.email}</p>
                  <p className="text-xs text-gray-500">Administrador</p>
                </div>
              </div>
              <button onClick={handleLogout} className="w-full flex items-center px-3 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
                <Icon name="log-out" size={18} className="mr-3" />
                Cerrar Sesión
              </button>
            </div>
          </aside>

          {/* Contenido Principal */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50/50">
            {/* Header / Topbar */}
            <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 print-hidden">
              <div className="flex items-center md:hidden">
                <span className="text-xl font-bold text-gray-800">GestiónPro</span>
              </div>
              <h1 className="text-xl font-bold text-gray-800 hidden md:block capitalize">
                {menuItems.find(m => m.id === activeTab)?.label}
              </h1>
              <div className="flex items-center gap-4">
                <button className="text-gray-400 hover:text-gray-600 relative">
                  <Icon name="bell" size={20} />
                  <span className="absolute top-0 right-0 block h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
                </button>
              </div>
            </header>

            {/* Área de Renderizado de Vistas */}
            <div className="flex-1 overflow-auto p-6">
              <div className="max-w-7xl mx-auto">
                {renderContent()}
              </div>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
