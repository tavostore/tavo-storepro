    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #3b82f6; --bg: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f8fafc; margin: 0; overflow-x: hidden; background-attachment: fixed; background-size: cover; background-position: center; }
        .premium-glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        .product-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        .input-elegant { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.8rem; padding: 0.75rem 1rem; color: white; width: 100%; outline: none; transition: border-color 0.3s; }
        .input-elegant:focus { border-color: var(--primary); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 99px; border: 2px solid var(--bg); }
        .ai-chat-window { height: 480px; width: 320px; display: flex; flex-direction: column; }
        .badge-finance { background: linear-gradient(90deg, #3b82f6, #8b5cf6); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .file-upload-btn { background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2); padding: 10px; border-radius: 12px; text-align: center; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>

<body id="body-bg">
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        const SUPABASE_URL = "https://zxtrwaykhpyqcycvkwgr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dHJ3YXlraHB5cWN5Y3Zrd2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODA2MzcsImV4cCI6MjA4ODc1NjYzN30.RQ1s-Ey-cpYKmlZELsTB-F1P6MB6ywvlfMXE-HXbAJA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.storeApi = {
            async readConfig() {
                const { data } = await supabase.from('configuracion').select('*').eq('id', 'general').single();
                return data;
            },
            async ensureConfig(defaultData) {
                const existing = await this.readConfig();
                if (!existing) await supabase.from('configuracion').insert([{ id: 'general', ...defaultData }]);
            },
            subscribeConfig(callback) {
                this.readConfig().then(data => data && callback(data));
                const channel = supabase.channel('config-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'configuracion' }, payload => callback(payload.new))
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            subscribeProducts(callback) {
                const load = async () => {
                    const { data } = await supabase.from('productos').select('*').order('created_at', { ascending: true });
                    callback(data || []);
                };
                load();
                const channel = supabase.channel('products-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, () => load())
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            async updateConfig(patch) { await supabase.from('configuracion').update(patch).eq('id', 'general'); },
            async createProduct(id, data) { await supabase.from('productos').insert([{ id, ...data }]); },
            async updateProduct(id, patch) { await supabase.from('productos').update(patch).eq('id', id); },
            async deleteProduct(id) { await supabase.from('productos').delete().eq('id', id); },
            // FUNCIÓN PARA STORAGE
            async uploadFile(file) {
                const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                const { error } = await supabase.storage.from('tavostore').upload(fileName, file);
                if (error) throw error;
                const { data } = supabase.storage.from('tavostore').getPublicUrl(fileName);
                return data.publicUrl;
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('store');
            const [isAdmin, setIsAdmin] = useState(false);
            const [loading, setLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [showAI, setShowAI] = useState(false);
            const [uploadingId, setUploadingId] = useState(null);
            const [data, setData] = useState({
                rate: 62.00,
                settings: { logo: "TAVO STORE", whatsapp: "584249649769", banner: "", background: "" },
                products: []
            });

            useEffect(() => {
                window.storeApi.ensureConfig({ rate: data.rate, settings: data.settings });
                const unsubS = window.storeApi.subscribeConfig((cloud) => {
                    setData(prev => ({ ...prev, ...cloud }));
                    if (cloud.settings?.background) document.body.style.backgroundImage = `url('${cloud.settings.background}')`;
                });
                const unsubP = window.storeApi.subscribeProducts((list) => {
                    setData(prev => ({ ...prev, products: list }));
                    setLoading(false);
                });
                return () => { unsubS(); unsubP(); };
            }, []);

            // FUNCIÓN LOCAL PARA ELIMINAR EL LAG
            const updateProductLocal = (id, field, value) => {
                const updatedProducts = data.products.map(p => p.id === id ? { ...p, [field]: value } : p);
                setData(prev => ({ ...prev, products: updatedProducts }));
                
                clearTimeout(window.saveTimeout);
                window.saveTimeout = setTimeout(() => {
                    window.storeApi.updateProduct(id, { [field]: value });
                }, 800);
            };

            const handleStorageUpload = async (e, type, productId = null) => {
                const file = e.target.files[0];
                if (!file) return;
                if (productId) setUploadingId(productId);
                try {
                    const url = await window.storeApi.uploadFile(file);
                    if (type === 'product') {
                        window.storeApi.updateProduct(productId, { img: url });
                    } else {
                        const newSettings = { ...data.settings, [type]: url };
                        window.storeApi.updateConfig({ settings: newSettings });
                    }
                } catch (err) { alert("Error al subir"); }
                finally { setUploadingId(null); }
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const cartTotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const checkout = () => {
                let msg = `🛍️ *PEDIDO - ${data.settings.logo}*\n\n`;
                cart.forEach(item => { msg += `• ${item.name} (x${item.qty}) - $${item.price * item.qty}\n`; });
                msg += `\n💵 *TOTAL:* $${cartTotal.toFixed(2)}\n`;
                window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
            };

            const AIChat = () => {
                const [input, setInput] = useState("");
                const [chat, setChat] = useState([{ role: 'bot', text: "¡Hola! ¿En qué puedo ayudarte hoy?" }]);
                return (
                    <div className="flex flex-col h-full bg-[#0f172a]">
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {chat.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-2xl text-[11px] ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white/10 text-slate-200'}`}>{msg.text}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-3 border-t border-white/5 flex gap-2">
                            <input value={input} onChange={e => setInput(e.target.value)} className="input-elegant text-[11px]" placeholder="Pregunta algo..." />
                            <button className="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center"><i className="fas fa-paper-plane text-xs"></i></button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20 relative">
                    {/* FONDO OSCURO RESTAURADO */}
                    <div className="fixed inset-0 bg-black/50 pointer-events-none -z-10"></div>
                    
                    <nav className="fixed top-0 w-full z-50 premium-glass px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('store')}>
                            <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30"><i className="fas fa-bolt"></i></div>
                            <span className="text-lg font-black uppercase tracking-tighter italic">{data.settings.logo}</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setShowCart(true)} className="relative w-11 h-11 bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center">
                                <i className="fas fa-shopping-bag text-sm"></i>
                                {cart.length > 0 && <span className="cart-badge">{cart.length}</span>}
                            </button>
                            <button onClick={() => setView(view === 'admin' ? 'store' : 'admin')} className="bg-white/5 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase border border-white/5">{view === 'admin' ? 'Tienda' : 'Admin'}</button>
                        </div>
                    </nav>

                    {view === 'store' ? (
                        <div className="fade-in pt-16">
                            <header className="relative h-[45vh] flex items-center justify-center overflow-hidden">
                                {data.settings.banner && <img src={data.settings.banner} className="absolute inset-0 w-full h-full object-cover opacity-40" />}
                                <div className="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-transparent"></div>
                                <div className="relative text-center px-4">
                                    <h1 className="text-6xl md:text-8xl font-black italic uppercase tracking-tighter mb-4">{data.settings.logo}</h1>
                                    <div className="inline-flex items-center gap-3 bg-blue-600/20 border border-blue-500/30 px-6 py-2 rounded-2xl backdrop-blur-md">
                                        <p className="text-[10px] font-black uppercase tracking-widest text-blue-100">Dólar BCV: <span className="text-white ml-1">Bs. {data.rate.toFixed(2)}</span></p>
                                    </div>
                                </div>
                            </header>

                            {/* SECCIÓN HERO PROMO RESTAURADA */}
                            <section className="max-w-7xl mx-auto px-6 pt-20 pb-10">
                                <div className="grid md:grid-cols-2 gap-8 items-center">
                                    <div className="space-y-6">
                                        <h2 className="text-5xl md:text-6xl font-black italic uppercase text-white leading-tight">Ofertas Especiales</h2>
                                        <p className="text-slate-300 text-sm md:text-base">Descubre promociones exclusivas y los mejores productos de {data.settings.logo}.</p>
                                        <div className="flex gap-4">
                                            <a href="#productos" className="bg-blue-600 px-6 py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-blue-600/30">Ver Productos</a>
                                            <button onClick={() => window.open(`https://wa.me/${data.settings.whatsapp}`)} className="bg-white/10 border border-white/20 px-6 py-4 rounded-2xl text-xs font-black uppercase">Contactar</button>
                                        </div>
                                    </div>
                                    <div className="relative">
                                        {data.settings.banner ? (<img src={data.settings.banner} className="rounded-[2rem] shadow-2xl border border-white/10" />) : (<div className="h-72 flex items-center justify-center rounded-[2rem] bg-gradient-to-br from-blue-600 to-purple-600 text-white font-black text-2xl uppercase italic">Promo</div>)}
                                    </div>
                                </div>
                            </section>

                            <h2 id="productos" className="text-center text-3xl font-black italic uppercase my-10">Productos</h2>
                            <div className="max-w-7xl mx-auto px-4 md:px-6 grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 pb-20">
                                {data.products.map(p => (
                                    <div key={p.id} className="product-card premium-glass rounded-[1.8rem] overflow-hidden flex flex-col group">
                                        <div className="aspect-[4/5] relative overflow-hidden bg-slate-900">
                                            {p.img && <img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />}
                                            <div className="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-xl text-[8px] font-black uppercase border border-white/10">{p.status === 'stock' ? 'Disponible' : 'Bajo pedido'}</div>
                                            {/* CUOTAS RESTAURADAS */}
                                            {p.price > 20 && <div className="absolute bottom-4 left-4 right-4 badge-finance py-2 px-3 rounded-2xl text-center"><p className="text-[9px] font-black uppercase tracking-tighter text-white">2 o 3 Cuotas ✨</p></div>}
                                        </div>
                                        <div className="p-5 flex flex-col flex-1">
                                            <h3 className="text-[11px] font-bold uppercase mb-4 h-9 text-slate-100">{p.name}</h3>
                                            <div className="mt-auto">
                                                <div className="mb-5">
                                                    <p className="text-2xl font-black italic text-white">${p.price}</p>
                                                    <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tight">Bs. {(p.price * data.rate).toLocaleString('es-VE')}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => addToCart(p)} className="flex-1 bg-white/5 border border-white/10 h-11 rounded-2xl flex items-center justify-center"><i className="fas fa-cart-plus text-xs"></i></button>
                                                    <button onClick={() => window.open(`https://wa.me/${data.settings.whatsapp}?text=Hola! Quiero: ${p.name}`)} className="flex-1 bg-blue-600 h-11 rounded-2xl flex items-center justify-center gap-2"><i className="fab fa-whatsapp text-sm"></i><span className="text-[9px] font-black uppercase">Pedir</span></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-5xl mx-auto px-6 py-32 fade-in">
                            {!isAdmin ? (
                                <div className="flex items-center justify-center h-[50vh]">
                                    <div className="premium-glass p-10 rounded-[3rem] w-full max-w-xs text-center">
                                        <input type="password" placeholder="Clave" className="input-elegant text-center mb-6" onKeyDown={e => e.key === 'Enter' && e.target.value === 'tavo2026' && setIsAdmin(true)} />
                                        <button onClick={(e) => e.target.previousSibling.value === 'tavo2026' ? setIsAdmin(true) : alert('Clave incorrecta')} className="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-[11px]">Acceder</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-12">
                                    {/* PALABRA CONFIGURACIÓN RESTAURADA */}
                                    <h2 className="text-3xl font-black italic uppercase text-white">Configuración</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="premium-glass p-8 rounded-[2rem] space-y-6">
                                            <div>
                                                <label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Tasa USD</label>
                                                <div className="flex gap-2">
                                                    <input type="number" step="0.01" className="input-elegant font-black text-2xl" value={data.rate} onChange={e => setData({...data, rate: parseFloat(e.target.value)})} />
                                                    {/* BOTÓN ACTUALIZAR TASA RESTAURADO */}
                                                    <button onClick={() => window.storeApi.updateConfig({ rate: data.rate })} className="bg-blue-600 px-4 rounded-2xl text-[10px] font-black uppercase">Actualizar</button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Logo Texto</label>
                                                <input className="input-elegant font-bold uppercase" value={data.settings.logo} onChange={e => {
                                                    const newSets = {...data.settings, logo: e.target.value};
                                                    setData({...data, settings: newSets});
                                                    window.storeApi.updateConfig({ settings: newSets });
                                                }} />
                                            </div>
                                        </div>
                                        {/* CARGA DE BANNER Y FONDO RESTAURADOS */}
                                        <div className="premium-glass p-8 rounded-[2rem] space-y-6">
                                            <div><label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Fondo Web</label><div className="file-upload-btn" onClick={() => document.getElementById('bgInp').click()}>Subir Fondo</div><input id="bgInp" type="file" className="hidden" onChange={e => handleStorageUpload(e, 'background')} /></div>
                                            <div><label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Banner Hero</label><div className="file-upload-btn" onClick={() => document.getElementById('bnInp').click()}>Subir Banner</div><input id="bnInp" type="file" className="hidden" onChange={e => handleStorageUpload(e, 'banner')} /></div>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        {/* BOTÓN AGREGAR PRODUCTO RESTAURADO */}
                                        <div className="flex justify-between items-center"><h3 className="text-xl font-black italic uppercase">Inventario</h3><button onClick={() => window.storeApi.createProduct("p_"+Date.now(), {name:"Nuevo", price:10, status:"stock"})} className="bg-white/5 border border-white/10 px-6 py-3 rounded-2xl text-[10px] font-black uppercase">+ Agregar Producto</button></div>
                                        <div className="grid grid-cols-1 gap-4">
                                            {data.products.map(p => (
                                                <div key={p.id} className="premium-glass p-5 rounded-2xl flex flex-wrap md:flex-nowrap gap-5 items-center">
                                                    <div className="relative group cursor-pointer" onClick={() => document.getElementById(`f_${p.id}`).click()}>
                                                        <div className="w-16 h-16 rounded-xl bg-black overflow-hidden flex items-center justify-center">
                                                            {uploadingId === p.id ? <i className="fas fa-spinner fa-spin text-blue-500"></i> : <img src={p.img || 'https://placehold.co/100'} className="w-full h-full object-cover" />}
                                                        </div>
                                                        <input id={`f_${p.id}`} type="file" className="hidden" onChange={e => handleStorageUpload(e, 'product', p.id)} />
                                                    </div>
                                                    <div className="flex-1 space-y-3">
                                                        <input className="input-elegant text-[11px] font-bold" value={p.name} onChange={e => updateProductLocal(p.id, 'name', e.target.value)} />
                                                        <div className="flex gap-3">
                                                            <input className="input-elegant text-[11px] w-24" type="number" value={p.price} onChange={e => updateProductLocal(p.id, 'price', parseFloat(e.target.value))} />
                                                            {/* SELECCIÓN BAJO PEDIDO O STOCK RESTAURADA */}
                                                            <select className="input-elegant text-[10px] font-black w-32" value={p.status} onChange={e => updateProductLocal(p.id, 'status', e.target.value)}>
                                                                <option value="stock">Stock</option>
                                                                <option value="order">Bajo Pedido</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => window.storeApi.deleteProduct(p.id)} className="text-red-500 p-4"><i className="fas fa-trash-alt"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {showCart && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex justify-end">
                            <div className="w-full max-w-sm h-full bg-[#020617] p-8 flex flex-col border-l border-white/5">
                                {/* X PARA SALIR DEL CARRITO RESTAURADA */}
                                <div className="flex justify-between items-center mb-10"><h2 className="text-xl font-black italic uppercase">Carrito</h2><button onClick={() => setShowCart(false)} className="w-11 h-11 rounded-2xl bg-white/5 flex items-center justify-center"><i className="fas fa-times"></i></button></div>
                                <div className="flex-1 overflow-y-auto space-y-5">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-white/5 p-4 rounded-3xl">
                                            <img src={item.img} className="w-12 h-12 rounded-xl object-cover" />
                                            <div className="flex-1"><p className="text-[10px] font-black uppercase">{item.name}</p><p className="text-xs font-bold text-blue-500">${item.price}</p></div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-red-500"><i className="fas fa-trash-alt text-xs"></i></button>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={checkout} className="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase text-[11px] mt-6">Finalizar Pedido</button>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-4">
                        {showAI && <div className="premium-glass rounded-[2.5rem] overflow-hidden ai-chat-window fade-in mb-2"><AIChat /></div>}
                        <button onClick={() => setShowAI(!showAI)} className="w-14 h-14 bg-blue-600 rounded-2xl shadow-2xl flex items-center justify-center text-xl text-white border border-white/20"><i className={`fas ${showAI ? 'fa-times' : 'fa-comment-dots'}`}></i></button>
                    </div>

                    <footer className="text-center py-12 opacity-30 text-[9px] font-black uppercase tracking-[0.6em]">© 2026 {data.settings.logo}</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
