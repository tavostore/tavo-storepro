    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        const SUPABASE_URL = "https://zxtrwaykhpyqcycvkwgr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dHJ3YXlraHB5cWN5Y3Zrd2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODA2MzcsImV4cCI6MjA4ODc1NjYzN30.RQ1s-Ey-cpYKmlZELsTB-F1P6MB6ywvlfMXE-HXbAJA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.storeApi = {
            async readConfig() {
                const { data } = await supabase.from('configuracion').select('*').eq('id', 'general').single();
                return data;
            },
            async ensureConfig(defaultData) {
                const existing = await this.readConfig();
                if (!existing) await supabase.from('configuracion').insert([{ id: 'general', ...defaultData }]);
            },
            subscribeConfig(callback) {
                this.readConfig().then(data => data && callback(data));
                const channel = supabase.channel('config-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'configuracion' }, payload => callback(payload.new))
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            subscribeProducts(callback) {
                const load = async () => {
                    const { data } = await supabase.from('productos').select('*').order('created_at', { ascending: true });
                    callback(data || []);
                };
                load();
                const channel = supabase.channel('products-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, () => load())
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            subscribeVentas(callback) {
                const load = async () => {
                    const { data } = await supabase.from('ventas').select('*').order('fecha', { ascending: false });
                    callback(data || []);
                };
                load();
                const channel = supabase.channel('ventas-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'ventas' }, () => load())
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
             // ==============================================
            subscribeAbonos(callback) {
    const load = async () => {
        const { data } = await supabase.from('abonos').select('*').order('fecha', { ascending: false });
        callback(data || []);
    };
    load();
    const channel = supabase.channel('abonos-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'abonos' }, () => load())
        .subscribe();
    return () => supabase.removeChannel(channel);
},
            async registrarAbono(data) {
    const { error } = await supabase.from('abonos').insert([data]);
    if (error) throw error;
},
            async updateConfig(patch) { await supabase.from('configuracion').update(patch).eq('id', 'general'); },
            async createProduct(id, data) { await supabase.from('productos').insert([{ id, ...data }]); },
            async updateProduct(id, patch) { await supabase.from('productos').update(patch).eq('id', id); },
            async deleteProduct(id) { await supabase.from('productos').delete().eq('id', id); },
            async uploadFile(file) {
                const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                const { error } = await supabase.storage.from('tavostore').upload(fileName, file);
                if (error) throw error;
                const { data } = supabase.storage.from('tavostore').getPublicUrl(fileName);
                return data.publicUrl;
            },
            async createVenta(data) { await supabase.from('ventas').insert([data]); },
            async anularVenta(id) { await supabase.from('ventas').update({ estado: 'anulada' }).eq('id', id); },
            async updateProductStock(id, newStock) { await supabase.from('productos').update({ stock: newStock }).eq('id', id); }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [view, setView] = useState('store');
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminTab, setAdminTab] = useState('config'); // pestaña activa en admin
            const [loading, setLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [showAI, setShowAI] = useState(false);
            const [uploadingId, setUploadingId] = useState(null);
            const [data, setData] = useState({
                rate: 62.00,
                settings: { logo: "TAVO STORE", whatsapp: "584249649769", banner: "", background: "", hero_banner: "", promo_banner: "", hero_opacity: 0.4 },
                products: [],
                ventas: []
                abonos: []
            });

            useEffect(() => {
                window.storeApi.ensureConfig({ rate: data.rate, settings: data.settings });
                const unsubS = window.storeApi.subscribeConfig((cloud) => {
                    setData(prev => ({ ...prev, ...cloud }));
                    if (cloud.settings?.background) document.body.style.backgroundImage = `url('${cloud.settings.background}')`;
                });
                const unsubP = window.storeApi.subscribeProducts((list) => {
                    setData(prev => ({ ...prev, products: list }));
                    setLoading(false);
                });
                const unsubV = window.storeApi.subscribeVentas((list) => {
                    setData(prev => ({ ...prev, ventas: list }));
                });
                return () => { unsubS(); unsubP(); unsubV(); };
            }, []);

            const updateProductLocal = (id, field, value) => {
                const updatedProducts = data.products.map(p => p.id === id ? { ...p, [field]: value } : p);
                setData(prev => ({ ...prev, products: updatedProducts }));
                clearTimeout(window.saveTimeout);
                window.saveTimeout = setTimeout(() => {
                    window.storeApi.updateProduct(id, { [field]: value });
                }, 800);
            };

            const handleStorageUpload = async (e, type, productId = null) => {
                const file = e.target.files[0];
                if (!file) return;
                if (productId) setUploadingId(productId);
                try {
                    const url = await window.storeApi.uploadFile(file);
                    if (type === 'product') {
                        window.storeApi.updateProduct(productId, { img: url });
                    } else {
                        const newSettings = { ...data.settings, [type]: url };
                        window.storeApi.updateConfig({ settings: newSettings });
                    }
                } catch (err) { alert("Error al subir"); }
                finally { setUploadingId(null); }
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const cartTotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const checkout = () => {
                let msg = `🛍️ *PEDIDO - ${data.settings.logo}*\n\n`;
                cart.forEach(item => { msg += `• ${item.name} (x${item.qty}) - $${item.price * item.qty}\n`; });
                msg += `\n💵 *TOTAL:* $${cartTotal.toFixed(2)}\n`;
                window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
            };
         // ==============================================
        const unsubA = window.storeApi.subscribeAbonos(list => {
    setData(prev => ({ ...prev, abonos: list }));
});
return () => { unsubS(); unsubP(); unsubV(); unsubA(); };

            const AIChat = () => {
                const [input, setInput] = useState("");
                const [chat, setChat] = useState([{ role: 'bot', text: "¡Hola! ¿En qué puedo ayudarte hoy?" }]);
                return (
                    <div className="flex flex-col h-full bg-[#0f172a]">
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {chat.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-2xl text-[11px] ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white/10 text-slate-200'}`}>{msg.text}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-3 border-t border-white/5 flex gap-2">
                            <input value={input} onChange={e => setInput(e.target.value)} className="input-elegant text-[11px]" placeholder="Pregunta algo..." />
                            <button className="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center"><i className="fas fa-paper-plane text-xs"></i></button>
                        </div>
                    </div>
                );
            };

            // ==============================================
            // COMPONENTE ERP (nueva pestaña en admin)
            // ==============================================
            const ERP = () => {
                const [erpTab, setErpTab] = useState('venta');
                const [cliente, setCliente] = useState("");
                const [cartERP, setCartERP] = useState([]);
                const [abono, setAbono] = useState(0);
                const [itemSearch, setItemSearch] = useState("");
                const [itemPrice, setItemPrice] = useState("");
                const [itemQty, setItemQty] = useState(1);
                const [selectedProd, setSelectedProd] = useState(null);
                const [isDropdownOpen, setIsDropdownOpen] = useState(false);
                const [showInvoice, setShowInvoice] = useState(false);
                const [lastSale, setLastSale] = useState(null);

                const cartTotalERP = cartERP.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

                const addToCartERP = () => {
                    if (!itemSearch.trim() || !itemPrice) return alert("Completa los datos");
                    const newItem = {
                        tempId: Date.now(),
                        productoNombre: itemSearch.trim(),
                        productoId: selectedProd ? selectedProd.id : null,
                        precio: Number(itemPrice),
                        cantidad: Number(itemQty)
                    };
                    setCartERP([...cartERP, newItem]);
                    setItemSearch(""); setItemPrice(""); setItemQty(1); setSelectedProd(null); setIsDropdownOpen(false);
                };

                const processSale = async () => {
                    if (!cliente.trim() || cartERP.length === 0) return alert("Faltan datos");
                    try {
                        // Actualizar stock si es producto existente
                        for (const item of cartERP) {
                            if (item.productoId) {
                                const prod = data.products.find(p => p.id === item.productoId);
                                if (prod) {
                                    const nuevoStock = (prod.stock || 0) - item.cantidad;
                                    await window.storeApi.updateProductStock(item.productoId, nuevoStock);
                                }
                            }
                        }

                        const saleData = {
                            cliente: cliente.trim(),
                            items: cartERP,
                            total: cartTotalERP,
                            abono: Number(abono),
                            fecha: new Date().toISOString(),
                            estado: 'activa'
                        };

                        await window.storeApi.createVenta(saleData);
                        setLastSale(saleData);
                        setShowInvoice(true);
                        setCartERP([]); setCliente(""); setAbono(0);
                    } catch (e) {
                        alert("Error al procesar la venta");
                    }
                };

                const downloadInvoice = (sale) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 450;
                    canvas.height = 600 + (sale.items.length * 30);
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = "#3b82f6";
                    ctx.font = "bold 22px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("RECIBO DE VENTA", canvas.width / 2, 40);

                    ctx.fillStyle = "#64748b";
                    ctx.font = "10px Arial";
                    ctx.fillText(new Date(sale.fecha).toLocaleString(), canvas.width / 2, 60);

                    ctx.textAlign = "left";
                    ctx.fillStyle = "#94a3b8";
                    ctx.font = "bold 10px Arial";
                    ctx.fillText("CLIENTE:", 40, 100);

                    ctx.fillStyle = "#1e293b";
                    ctx.font = "bold 18px Arial";
                    ctx.fillText(sale.cliente.toUpperCase(), 40, 125);

                    let y = 165;
                    ctx.fillStyle = "#94a3b8";
                    ctx.font = "bold 10px Arial";
                    ctx.fillText("DETALLE DE PRODUCTOS:", 40, y);
                    y += 20;

                    ctx.font = "13px Arial";
                    ctx.fillStyle = "#1e293b";
                    sale.items.forEach(item => {
                        ctx.fillText(`${item.cantidad}x ${item.productoNombre}`, 40, y);
                        ctx.textAlign = "right";
                        ctx.font = "bold 13px Arial";
                        ctx.fillText(`$${(item.precio * item.cantidad).toLocaleString()}`, canvas.width - 40, y);
                        ctx.textAlign = "left";
                        ctx.font = "13px Arial";
                        y += 25;
                    });

                    y += 20;
                    ctx.strokeStyle = "#e5e7eb";
                    ctx.beginPath();
                    ctx.moveTo(40, y);
                    ctx.lineTo(canvas.width - 40, y);
                    ctx.stroke();

                    y += 30;
                    ctx.font = "14px Arial";
                    ctx.fillStyle = "#64748b";
                    ctx.fillText("TOTAL:", 40, y);
                    ctx.font = "bold 22px Arial";
                    ctx.fillStyle = "#1e293b";
                    ctx.textAlign = "right";
                    ctx.fillText(`$${sale.total.toLocaleString()}`, canvas.width - 40, y);

                    y += 30;
                    ctx.font = "14px Arial";
                    ctx.fillStyle = "#10b981";
                    ctx.textAlign = "left";
                    ctx.fillText("ABONADO:", 40, y);
                    ctx.textAlign = "right";
                    ctx.font = "bold 14px Arial";
                    ctx.fillText(`$${sale.abono.toLocaleString()}`, canvas.width - 40, y);

                    y += 25;
                    ctx.fillStyle = "#ef4444";
                    ctx.textAlign = "left";
                    ctx.font = "bold 14px Arial";
                    ctx.fillText("PENDIENTE:", 40, y);
                    ctx.textAlign = "right";
                    ctx.font = "bold 18px Arial";
                    ctx.fillText(`$${(sale.total - sale.abono).toLocaleString()}`, canvas.width - 40, y);

                    const link = document.createElement("a");
                    link.href = canvas.toDataURL("image/png");
                    link.download = `Factura-${sale.cliente}.png`;
                    link.click();
                };

                return (
                    <div className="premium-glass p-8 rounded-3xl space-y-8">
                        <div className="flex gap-4 border-b border-white/10 pb-4">
                            {['venta', 'stock', 'historial', 'deudas'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setErpTab(tab)}
                                    className={`px-6 py-3 rounded-2xl font-black text-sm transition ${erpTab === tab ? 'bg-blue-600 text-white' : 'bg-white/5 hover:bg-white/10'}`}
                                >
                                    {tab === 'venta' ? 'Nueva Venta' : tab === 'stock' ? 'Control Stock' : tab === 'historial' ? 'Historial' : 'Deudas'}
                                </button>
                            ))}
                        </div>

                        {erpTab === 'venta' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="space-y-6">
                                    <input
                                        value={cliente}
                                        onChange={e => setCliente(e.target.value)}
                                        placeholder="Nombre del cliente"
                                        className="input-elegant"
                                    />
                                    <div className="bg-white/5 p-6 rounded-2xl">
                                        <input
                                            value={itemSearch}
                                            onChange={e => {
                                                setItemSearch(e.target.value);
                                                setIsDropdownOpen(true);
                                            }}
                                            placeholder="Buscar producto..."
                                            className="input-elegant mb-4"
                                        />
                                        {isDropdownOpen && itemSearch && (
                                            <div className="bg-[#0f172a] border border-white/10 rounded-2xl max-h-48 overflow-auto">
                                                {data.products
                                                    .filter(p => p.name.toLowerCase().includes(itemSearch.toLowerCase()))
                                                    .map(p => (
                                                        <div
                                                            key={p.id}
                                                            className="p-4 hover:bg-blue-600 cursor-pointer"
                                                            onClick={() => {
                                                                setSelectedProd(p);
                                                                setItemSearch(p.name);
                                                                setItemPrice(p.price);
                                                                setIsDropdownOpen(false);
                                                            }}
                                                        >
                                                            {p.name} - ${p.price}
                                                        </div>
                                                    ))}
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-4">
                                            <input
                                                type="number"
                                                value={itemPrice}
                                                onChange={e => setItemPrice(e.target.value)}
                                                placeholder="Precio"
                                                className="input-elegant"
                                            />
                                            <input
                                                type="number"
                                                value={itemQty}
                                                onChange={e => setItemQty(e.target.value)}
                                                placeholder="Cantidad"
                                                className="input-elegant"
                                            />
                                        </div>
                                        <button onClick={addToCartERP} className="w-full mt-6 bg-blue-600 py-4 rounded-2xl font-black">
                                            + Añadir al Carrito
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white/5 p-6 rounded-2xl flex flex-col">
                                    <h3 className="font-black text-xl mb-6">Resumen Factura</h3>
                                    <div className="flex-1 overflow-y-auto space-y-4">
                                        {cartERP.length === 0 ? (
                                            <p className="text-center text-slate-400 py-10">Carrito vacío</p>
                                        ) : (
                                            cartERP.map(item => (
                                                <div key={item.tempId} className="flex justify-between bg-white/10 p-4 rounded-2xl">
                                                    <div>{item.productoNombre} × {item.cantidad}</div>
                                                    <div className="font-black">${(item.precio * item.cantidad).toLocaleString()}</div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="pt-6 border-t border-white/10">
                                        <div className="flex justify-between text-2xl font-black mb-4">
                                            <span>Total</span>
                                            <span>${cartTotalERP.toLocaleString()}</span>
                                        </div>
                                        <input
                                            type="number"
                                            value={abono}
                                            onChange={e => setAbono(e.target.value)}
                                            placeholder="Abono / Pago adelantado"
                                            className="input-elegant mb-4"
                                        />
                                        <button onClick={processSale} className="w-full bg-emerald-600 py-5 rounded-2xl font-black text-lg">
                                            Procesar Factura
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {erpTab === 'stock' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {data.products.map(p => (
                                    <div key={p.id} className="premium-glass p-6 rounded-2xl">
                                        <div className="font-black">{p.name}</div>
                                        <div className="text-3xl font-black text-blue-400 mt-2">${p.price}</div>
                                        <div className="mt-4 flex justify-between items-center">
                                            <span>Stock: <span className="font-black">{p.stock || 0}</span></span>
                                            <button
                                                onClick={() => {
                                                    const nuevo = prompt(`Nuevo stock para ${p.name}:`, p.stock || 0);
                                                    if (nuevo !== null) {
                                                        window.storeApi.updateProductStock(p.id, parseFloat(nuevo));
                                                    }
                                                }}
                                                className="bg-blue-600 px-5 py-2 rounded-xl text-xs font-black"
                                            >
                                                Editar Stock
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {erpTab === 'historial' && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="text-xs uppercase border-b border-white/10">
                                            <th className="py-4">Fecha</th>
                                            <th className="py-4">Cliente</th>
                                            <th className="py-4">Total</th>
                                            <th className="py-4">Estado</th>
                                            <th className="py-4 text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.ventas.map(v => (

                    )}

                    {showCart && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex justify-end">
                            <div className="w-full max-w-sm h-full bg-[#020617] p-8 flex flex-col border-l border-white/5">
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-xl font-black italic uppercase">Carrito</h2>
                                    <button onClick={() => setShowCart(false)} className="w-11 h-11 rounded-2xl bg-white/5 flex items-center justify-center">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-5">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-white/5 p-4 rounded-3xl">
                                            <img src={item.img} className="w-12 h-12 rounded-xl object-cover" />
                                            <div className="flex-1">
                                                <p className="text-[10px] font-black uppercase">{item.name}</p>
                                                <p className="text-xs font-bold text-blue-500">${item.price}</p>
                                            </div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-red-500">
                                                <i className="fas fa-trash-alt text-xs"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={checkout} className="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase text-[11px] mt-6">
                                    Finalizar Pedido
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-4">
                        {showAI && <div className="premium-glass rounded-[2.5rem] overflow-hidden ai-chat-window fade-in mb-2"><AIChat /></div>}
                        <button
                            onClick={() => setShowAI(!showAI)}
                            className="w-14 h-14 bg-blue-600 rounded-2xl shadow-2xl flex items-center justify-center text-xl text-white border border-white/20"
                        >
                            <i className={`fas ${showAI ? 'fa-times' : 'fa-comment-dots'}`}></i>
                        </button>
                    </div>

                    <footer className="text-center py-12 opacity-30 text-[9px] font-black uppercase tracking-[0.6em]">
                        © 2026 {data.settings.logo}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
