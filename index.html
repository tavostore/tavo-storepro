        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        const SUPABASE_URL = "https://zxtrwaykhpyqcycvkwgr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dHJ3YXlraHB5cWN5Y3Zrd2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODA2MzcsImV4cCI6MjA4ODc1NjYzN30.RQ1s-Ey-cpYKmlZELsTB-F1P6MB6ywvlfMXE-HXbAJA"; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.storeApi = {
            async readConfig() {
                const { data, error } = await supabase.from('configuracion').select('*').eq('id', 'general').single();
                if (error && error.code !== 'PGRST116') throw error;
                return data;
            },
            async ensureConfig(defaultData) {
                const existing = await this.readConfig();
                if (existing) return existing;
                const { data } = await supabase.from('configuracion').insert([{ id: 'general', ...defaultData }]);
                return data;
            },
            subscribeConfig(callback) {
                this.readConfig().then(data => data && callback(data));
                const channel = supabase.channel('config-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'configuracion' }, payload => callback(payload.new))
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            subscribeProducts(callback) {
                const load = async () => {
                    const { data } = await supabase.from('productos').select('*').order('created_at', { ascending: true });
                    callback(data || []);
                };
                load();
                const channel = supabase.channel('products-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, () => load())
                    .subscribe();
                return () => supabase.removeChannel(channel);
            },
            async updateConfig(patch) {
                const { error } = await supabase.from('configuracion').update(patch).eq('id', 'general');
                if (error) throw error;
            },
            async createProduct(id, data) {
                return await supabase.from('productos').insert([{ id, ...data }]);
            },
            async updateProduct(id, patch) {
                return await supabase.from('productos').update(patch).eq('id', id);
            },
            async deleteProduct(id) {
                return await supabase.from('productos').delete().eq('id', id);
            },
            // NUEVA FUNCIÓN AÑADIDA PARA STORAGE
            async uploadFile(file) {
                const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                const { data, error } = await supabase.storage.from('tavostore').upload(fileName, file);
                if (error) throw error;
                const { data: urlData } = supabase.storage.from('tavostore').getPublicUrl(fileName);
                return urlData.publicUrl;
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('store');
            const [isAdmin, setIsAdmin] = useState(false);
            const [loading, setLoading] = useState(true);
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [showAI, setShowAI] = useState(false);
            const [uploadingId, setUploadingId] = useState(null); // Para saber qué imagen se está subiendo
            const [data, setData] = useState({
                rate: 62.00,
                settings: { logo: "TAVO STORE", whatsapp: "584249649769", banner: "", background: "" },
                products: []
            });

            useEffect(() => {
                if (!window.storeApi) return;
                window.storeApi.ensureConfig({ rate: data.rate, settings: data.settings }).catch((error) => console.error(error));
                const unsubS = window.storeApi.subscribeConfig((cloudData) => {
                    setData(prev => ({ ...prev, ...cloudData }));
                    if (cloudData.settings?.background) { document.body.style.backgroundImage = `url('${cloudData.settings.background}')`; }
                });
                const unsubP = window.storeApi.subscribeProducts((list) => {
                    setData(prev => ({ ...prev, products: list }));
                    setLoading(false);
                });
                return () => { unsubS(); unsubP(); };
            }, []);

            // NUEVA FUNCIÓN PARA ACTUALIZAR LOCALMENTE (QUITA EL LAG)
            const updateProductLocal = (id, field, value) => {
                const updatedProducts = data.products.map(p => p.id === id ? { ...p, [field]: value } : p);
                setData(prev => ({ ...prev, products: updatedProducts }));
                
                clearTimeout(window.saveTimeout);
                window.saveTimeout = setTimeout(() => {
                    window.storeApi.updateProduct(id, { [field]: value });
                }, 800); 
            };

            // NUEVA FUNCIÓN PARA SUBIR IMÁGENES AL STORAGE
            const handleStorageUpload = async (e, productId) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploadingId(productId);
                try {
                    const publicUrl = await window.storeApi.uploadFile(file);
                    window.storeApi.updateProduct(productId, { img: publicUrl });
                } catch (err) {
                    alert("Error al subir imagen. Revisa las políticas del bucket 'tavostore'");
                } finally {
                    setUploadingId(null);
                }
            };

            // Mantengo tus funciones originales por si las necesitas
            const handleFileUpload = (e, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => callback(reader.result);
                reader.readAsDataURL(file);
            };

            const processFlexibleImageUpload = (e, callback, options = {}) => {
                const file = e.target.files[0];
                if (!file) return;
                const { maxWidth = 1920, maxHeight = 1080, quality = 0.85 } = options;
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const ratio = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
                    canvas.width = Math.round(img.width * ratio);
                    canvas.height = Math.round(img.height * ratio);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/webp', quality));
                    URL.revokeObjectURL(objectUrl);
                };
                img.src = objectUrl;
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const cartTotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const checkout = () => {
                let msg = `🛍️ *PEDIDO - ${data.settings.logo}*\n\n`;
                cart.forEach(item => { msg += `• ${item.name} (x${item.qty}) - $${item.price * item.qty}\n`; });
                msg += `\n💵 *TOTAL:* $${cartTotal.toFixed(2)}\n🇻🇪 *TOTAL BS:* Bs. ${(cartTotal * data.rate).toLocaleString('es-VE')}\n\n_Tasa aplicada: Bs. ${data.rate}_`;
                window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
            };

            const quickBuy = (p) => {
                let msg = `👋 Hola! Quiero comprar:\n\n📌 *${p.name}*\n💰 *Precio:* $${p.price}\n\n_Tasa: Bs. ${data.rate}_`;
                window.open(`https://wa.me/${data.settings.whatsapp}?text=${encodeURIComponent(msg)}`);
            };

            const AIChat = () => {
                const [input, setInput] = useState("");
                const [chat, setChat] = useState([{ role: 'bot', text: `¡Hola! Soy el asistente de ${data.settings.logo}. ¿Buscas algo en especial?` }]);
                const [isTyping, setIsTyping] = useState(false);
                const chatEnd = useRef(null);

                const askAI = async () => {
                    if (!input.trim()) return;
                    const userText = input; setInput("");
                    setChat(prev => [...prev, { role: 'user', text: userText }]);
                    setIsTyping(true);
                    try {
                        const systemPrompt = `Eres el asistente de la tienda "${data.settings.logo}". Tasa: Bs. ${data.rate}. Productos: ${data.products.map(p => `${p.name} ($${p.price})`).join(", ")}.`;
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=TU_API_KEY`, {
                            method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                        });
                        const result = await response.json();
                        const botText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (botText) setChat(prev => [...prev, { role: 'bot', text: botText }]);
                    } catch (e) { setChat(prev => [...prev, { role: 'bot', text: "No pude procesar tu consulta." }]); } finally { setIsTyping(false); }
                };
                useEffect(() => chatEnd.current?.scrollIntoView({ behavior: 'smooth' }), [chat]);
                return (
                    <div className="flex flex-col h-full bg-[#0f172a]">
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {chat.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-3 rounded-2xl text-[11px] leading-relaxed ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white/10 text-slate-200 border border-white/5'}`}>
                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEnd} />
                        </div>
                        <div className="p-3 border-t border-white/5 flex gap-2 bg-[#020617]">
                            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && askAI()} className="input-elegant text-[11px] h-10" placeholder="Pregunta..." />
                            <button onClick={askAI} className="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center shrink-0"><i className="fas fa-paper-plane text-xs"></i></button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20 relative">
                    <nav className="fixed top-0 w-full z-50 premium-glass px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('store')}>
                            <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30"><i className="fas fa-bolt"></i></div>
                            <span className="text-lg font-black uppercase tracking-tighter italic">{data.settings.logo}</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setShowCart(true)} className="relative w-11 h-11 bg-white/5 rounded-2xl border border-white/5 flex items-center justify-center">
                                <i className="fas fa-shopping-bag text-sm"></i>
                                {cart.length > 0 && <span className="cart-badge">{cart.length}</span>}
                            </button>
                            <button onClick={() => setView(view === 'admin' ? 'store' : 'admin')} className="bg-white/5 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase border border-white/5">
                                {view === 'admin' ? 'Tienda' : 'Admin'}
                            </button>
                        </div>
                    </nav>

                    {view === 'store' ? (
                        <div className="fade-in pt-16">
                            <header className="relative h-[45vh] flex items-center justify-center overflow-hidden">
                                {data.settings.banner && <img src={data.settings.banner} className="absolute inset-0 w-full h-full object-cover opacity-40" />}
                                <div className="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-transparent"></div>
                                <div className="relative text-center px-4">
                                    <h1 className="text-6xl md:text-8xl font-black italic uppercase tracking-tighter mb-4">{data.settings.logo}</h1>
                                    <div className="inline-flex items-center gap-3 bg-blue-600/20 border border-blue-500/30 px-6 py-2 rounded-2xl backdrop-blur-md">
                                        <p className="text-[10px] font-black uppercase tracking-widest text-blue-100">Dólar BCV: <span className="text-white ml-1">Bs. {data.rate.toFixed(2)}</span></p>
                                    </div>
                                </div>
                            </header>

                            {/* SECCIÓN HERO PROMO PRESERVADA INTACTA */}
                            <section className="max-w-7xl mx-auto px-6 pt-20 pb-10">
                              <div className="grid md:grid-cols-2 gap-8 items-center">
                                <div className="space-y-6">
                                  <h2 className="text-5xl md:text-6xl font-black italic uppercase text-white leading-tight">Ofertas Especiales</h2>
                                  <p className="text-slate-300 text-sm md:text-base">Descubre promociones exclusivas y los mejores productos de {data.settings.logo}. Aprovecha nuestras ofertas limitadas y compra fácilmente desde WhatsApp.</p>
                                  <div className="flex gap-4">
                                    <a href="#productos" className="bg-blue-600 px-6 py-4 rounded-2xl text-xs font-black uppercase shadow-lg shadow-blue-600/30">Ver Productos</a>
                                    <button onClick={()=>window.open(`https://wa.me/${data.settings.whatsapp}`)} className="bg-white/10 border border-white/20 px-6 py-4 rounded-2xl text-xs font-black uppercase">Contactar</button>
                                  </div>
                                </div>
                                <div className="relative">
                                  {data.settings.banner ? (<img src={data.settings.banner} className="rounded-[2rem] shadow-2xl border border-white/10"/>) : (<div className="h-72 flex items-center justify-center rounded-[2rem] bg-gradient-to-br from-blue-600 to-purple-600 text-white font-black text-2xl">PROMO</div>)}
                                </div>
                              </div>
                            </section>

                            <h2 id="productos" className="text-center text-3xl font-black italic uppercase mb-10">Productos</h2>
                            <div className="max-w-7xl mx-auto px-4 md:px-6 grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 pb-20">
                                {data.products.map(p => (
                                    <div key={p.id} className="product-card premium-glass rounded-[1.8rem] overflow-hidden flex flex-col group">
                                        <div className="aspect-[4/5] relative overflow-hidden bg-slate-900">
                                            {p.img && <img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />}
                                            <div className="absolute top-4 left-4 bg-black/60 px-3 py-1 rounded-xl text-[8px] font-black uppercase">{p.status === 'stock' ? 'Disponible' : 'Bajo pedido'}</div>
                                        </div>
                                        <div className="p-5 flex flex-col flex-1">
                                            <h3 className="text-[11px] font-bold uppercase mb-4 h-9 text-slate-100">{p.name}</h3>
                                            <div className="mt-auto">
                                                <p className="text-2xl font-black italic text-white">${p.price}</p>
                                                <div className="flex gap-2 mt-4">
                                                    <button onClick={() => addToCart(p)} className="flex-1 bg-white/5 border border-white/10 h-11 rounded-2xl"><i className="fas fa-cart-plus"></i></button>
                                                    <button onClick={() => quickBuy(p)} className="flex-1 bg-blue-600 h-11 rounded-2xl font-black uppercase text-[9px]">Pedir</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-5xl mx-auto px-6 py-32 fade-in">
                            {!isAdmin ? (
                                <div className="flex items-center justify-center h-[50vh]">
                                    <div className="premium-glass p-10 rounded-[3rem] w-full max-w-xs text-center">
                                        <input type="password" placeholder="Clave" className="input-elegant text-center mb-6" onKeyDown={e => e.key === 'Enter' && e.target.value === 'tavo2026' && setIsAdmin(true)} />
                                        <button onClick={(e) => e.target.previousSibling.value === 'tavo2026' ? setIsAdmin(true) : alert('Clave incorrecta')} className="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-[11px]">Acceder</button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-12">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="premium-glass p-8 rounded-[2rem] space-y-6">
                                            <div>
                                                <label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Tasa USD</label>
                                                <input type="number" step="0.01" className="input-elegant font-black text-2xl" value={data.rate} onChange={e => { setData({...data, rate: parseFloat(e.target.value)}); window.storeApi.updateConfig({ rate: parseFloat(e.target.value) }); }} />
                                            </div>
                                            <div>
                                                <label className="text-[9px] font-black text-slate-500 uppercase block mb-3">Nombre Tienda</label>
                                                <input className="input-elegant font-bold uppercase" value={data.settings.logo} onChange={e => { setData({...data, settings: {...data.settings, logo: e.target.value}}); window.storeApi.updateConfig({ settings: { ...data.settings, logo: e.target.value } }); }} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <h3 className="text-xl font-black italic uppercase">Inventario</h3>
                                        {data.products.map(p => (
                                            <div key={p.id} className="premium-glass p-5 rounded-2xl flex gap-5 items-center">
                                                <div className="relative cursor-pointer" onClick={() => document.getElementById(`file_${p.id}`).click()}>
                                                    <img src={p.img || 'https://placehold.co/100'} className="w-20 h-20 rounded-2xl object-cover bg-black" />
                                                    {uploadingId === p.id && <div className="absolute inset-0 bg-black/60 flex items-center justify-center rounded-2xl"><i className="fas fa-spinner fa-spin"></i></div>}
                                                    {/* ACTUALIZADO: AHORA SUBE A STORAGE */}
                                                    <input id={`file_${p.id}`} type="file" className="hidden" onChange={e => handleStorageUpload(e, p.id)} />
                                                </div>
                                                <div className="flex-1 space-y-3">
                                                    {/* ACTUALIZADO: AHORA USAN updateProductLocal (SIN LAG) */}
                                                    <input className="input-elegant text-[11px] font-bold" value={p.name} onChange={e => updateProductLocal(p.id, 'name', e.target.value)} />
                                                    <input className="input-elegant text-[11px] w-28" type="number" value={p.price} onChange={e => updateProductLocal(p.id, 'price', parseFloat(e.target.value))} />
                                                </div>
                                                <button onClick={() => window.storeApi.deleteProduct(p.id)} className="text-red-500 p-4"><i className="fas fa-trash-alt"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {showCart && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex justify-end">
                            <div className="w-full max-w-sm h-full bg-[#020617] p-8 flex flex-col border-l border-white/5">
                                <h2 className="text-xl font-black italic uppercase mb-10">Tu Carrito</h2>
                                <div className="flex-1 overflow-y-auto space-y-5">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex gap-4 items-center bg-white/5 p-4 rounded-3xl">
                                            <img src={item.img} className="w-12 h-12 rounded-xl object-cover" />
                                            <div className="flex-1">
                                                <p className="text-[10px] font-black uppercase">{item.name}</p>
                                                <p className="text-xs font-bold text-blue-500">${item.price}</p>
                                            </div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-red-500 text-xs"><i className="fas fa-trash-alt"></i></button>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={checkout} className="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase text-[11px] mt-6">Enviar Pedido</button>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-4">
                        {showAI && (<div className="premium-glass rounded-[2.5rem] overflow-hidden ai-chat-window fade-in"><AIChat /></div>)}
                        <button onClick={() => setShowAI(!showAI)} className="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white"><i className={`fas ${showAI ? 'fa-times' : 'fa-comment-dots'}`}></i></button>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
